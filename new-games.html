<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Games — AJ GameTime</title>
<meta name="description" content="Brand new browser games at AJ GameTime. Play Agent Ops and more!">
<link rel="canonical" href="https://ajgametime.com/new-games.html">
<meta name="robots" content="index, follow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<style>
@import url('https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --purple: #7c3aed;
  --blue: #3b82f6;
  --cyan: #06b6d4;
  --green: #22c55e;
  --dark: #0c0a1a;
  --card: #16132a;
}

body {
  font-family: 'Nunito', sans-serif;
  background: var(--dark);
  color: #e2e8f0;
  min-height: 100vh;
  overflow-x: hidden;
}

.bg-glow {
  position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
  background: radial-gradient(circle at 30% 40%, rgba(34,197,94,0.12) 0%, transparent 50%),
              radial-gradient(circle at 70% 60%, rgba(59,130,246,0.1) 0%, transparent 50%);
  animation: bgFloat 20s ease-in-out infinite; z-index: 0;
}
@keyframes bgFloat {
  0%, 100% { transform: translate(0,0); }
  33% { transform: translate(-2%,1%); }
  66% { transform: translate(1%,-2%); }
}

.container { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; padding: 0 1.5rem; }

.top-nav {
  display: flex; justify-content: space-between; align-items: center;
  padding: 1.25rem 0; gap: 1rem; flex-wrap: wrap;
}
.logo {
  font-family: 'Lilita One', cursive; font-size: 1.5rem;
  background: linear-gradient(135deg, var(--purple), var(--blue), var(--cyan));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  text-decoration: none;
}
.nav-links { display: flex; gap: 0.6rem; flex-wrap: wrap; }
.nav-btn {
  padding: 0.45rem 1rem; border-radius: 50px; font-size: 0.85rem; font-weight: 700;
  text-decoration: none; transition: all 0.2s; font-family: 'Nunito', sans-serif;
  border: 1.5px solid rgba(124,58,237,0.3); color: #94a3b8; background: rgba(22,19,42,0.6);
}
.nav-btn:hover { border-color: var(--purple); color: #e2e8f0; }
.nav-btn.active { background: var(--green); border-color: var(--green); color: white; }
.nav-btn.old { border-color: rgba(249,115,22,0.4); color: #fb923c; }

.hero { text-align: center; padding: 2.5rem 0 1.5rem; }
.hero-emoji { font-size: 3rem; display: block; margin-bottom: 0.5rem; }
.hero h1 {
  font-family: 'Lilita One', cursive;
  font-size: clamp(2rem, 6vw, 3rem);
  background: linear-gradient(135deg, #22c55e, #06b6d4, #3b82f6);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  margin-bottom: 0.4rem;
}
.hero p { color: #94a3b8; font-size: 1.05rem; font-weight: 600; }

.games-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1.5rem;
  padding-bottom: 3rem;
}

.game-card {
  background: var(--card);
  border: 2px solid rgba(34,197,94,0.25);
  border-radius: 20px;
  overflow: hidden;
  text-decoration: none;
  transition: all 0.3s;
  display: block;
  position: relative;
}
.game-card:hover {
  border-color: var(--green);
  transform: translateY(-8px);
  box-shadow: 0 20px 50px rgba(34,197,94,0.2);
}
.card-preview {
  height: 160px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 4.5rem;
  background: linear-gradient(135deg, #0c0a1a, #14532d);
}
.card-body { padding: 1.25rem; }
.card-body h3 {
  font-family: 'Lilita One', cursive;
  font-size: 1.4rem;
  color: #e2e8f0;
  margin-bottom: 0.35rem;
}
.card-body p { color: #64748b; font-size: 0.9rem; line-height: 1.45; }
.card-tag {
  display: inline-block;
  margin-top: 0.75rem;
  padding: 0.25rem 0.75rem;
  border-radius: 50px;
  font-size: 0.7rem;
  font-weight: 800;
  text-transform: uppercase;
  background: rgba(34,197,94,0.2);
  color: #4ade80;
}
.play-btn {
  display: block;
  margin: 0.9rem 1.25rem 1.25rem;
  padding: 0.7rem;
  text-align: center;
  border-radius: 12px;
  font-weight: 800;
  font-size: 0.9rem;
  color: white;
  background: linear-gradient(135deg, #22c55e, #06b6d4);
}
.new-badge {
  position: absolute;
  top: 12px;
  right: 12px;
  background: #22c55e;
  color: white;
  font-size: 0.65rem;
  font-weight: 800;
  padding: 3px 10px;
  border-radius: 20px;
}

footer { text-align: center; padding: 2rem 0 3rem; color: #334155; font-size: 0.75rem; }
footer a { color: #475569; text-decoration: none; }
</style>
</head>
<body>
<div class="bg-glow"></div>

<div class="container">
  <nav class="top-nav">
    <a href="/" class="logo">AJ GameTime</a>
    <div class="nav-links">
      <a href="/" class="nav-btn">Home</a>
      <a href="old-games.html" class="nav-btn old">Old Games</a>
      <a href="new-games.html" class="nav-btn active">New Games</a>
    </div>
  </nav>

  <div class="hero">
    <span class="hero-emoji">🚀</span>
    <h1>New Games</h1>
    <p>Brand new games built just for AJ GameTime</p>
  </div>

  <div class="games-grid">
    <a href="agent-ops.html" class="game-card">
      <span class="new-badge">NEW</span>
      <div class="card-preview">🕵️</div>
      <div class="card-body">
        <h3>Agent Ops</h3>
        <p>First-person spy shooter inspired by GoldenEye. Infiltrate the facility, eliminate targets, and complete the mission!</p>
        <span class="card-tag">3D FPS</span>
      </div>
      <div class="play-btn">▶ Play Now</div>
    </a>
  </div>
</div>

<footer>
  <p>Designed by <strong>AJ & Ignacio Rovira</strong> · <a href="/">AJ GameTime</a></p>
</footer>
</body>
</html>
