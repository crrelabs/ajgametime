<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tower Defense — AJ GameTime</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a12;font-family:Nunito,sans-serif;color:#e2e8f0;touch-action:none}
#c{display:block;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none;z-index:10}
#top{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:10px;flex-wrap:wrap;pointer-events:none}
.stat{background:rgba(0,0,0,.6);padding:8px 14px;border-radius:10px;font-weight:800;font-size:.85rem;border:1px solid rgba(255,255,255,.1)}
.stat span{color:#4ade80}
#waveInfo{position:absolute;top:60px;left:12px;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:10px;font-size:.8rem;font-weight:700}
#towers{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:center;max-width:96vw}
.tower-btn{padding:10px 14px;border-radius:12px;border:2px solid transparent;background:rgba(15,23,42,.85);color:#fff;font-family:'Lilita One',cursive;font-size:.9rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tower-btn.sel{border-color:#22c55e;box-shadow:0 0 12px rgba(34,197,94,.4)}
.tower-btn small{display:block;font-family:Nunito;font-size:.65rem;color:#94a3b8;font-weight:700}
.overlay{position:absolute;inset:0;background:rgba(10,10,18,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;text-align:center;padding:20px}
.overlay h1{font-family:'Lilita One',cursive;font-size:clamp(2rem,8vw,3.2rem);background:linear-gradient(135deg,#22c55e,#06b6d4,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.4rem}
.overlay p{color:#94a3b8;max-width:460px;margin:.4rem 0 1rem;line-height:1.45}
.btn{display:inline-block;padding:14px 28px;margin:6px;font-family:'Lilita One',cursive;font-size:1.1rem;color:#fff;background:linear-gradient(135deg,#22c55e,#06b6d4);border:none;border-radius:14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn.secondary{background:linear-gradient(135deg,#7c3aed,#3b82f6)}
#hint{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);font-size:.75rem;color:#64748b;pointer-events:none}
#waveBtn{position:absolute;top:16px;right:16px;pointer-events:auto;z-index:20}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" style="display:none">
  <div id="top">
    <div class="stat">LIVES <span id="lives">20</span></div>
    <div class="stat">GOLD <span id="gold">100</span></div>
    <div class="stat">WAVE <span id="wave">0</span></div>
    <div class="stat">SCORE <span id="score">0</span></div>
  </div>
  <button class="btn" id="waveBtn" style="display:none">START WAVE</button>
  <div id="waveInfo">Place towers, then start the wave</div>
  <div id="towers">
    <button class="tower-btn" data-t="gun"><small>GUN</small>$50</button>
    <button class="tower-btn" data-t="splash"><small>SPLASH</small>$80</button>
    <button class="tower-btn" data-t="slow"><small>SLOW</small>$70</button>
    <button class="tower-btn" data-t="sniper"><small>SNIPER</small>$120</button>
  </div>
  <div id="hint">Tap empty ground to place · Tap tower to upgrade</div>
</div>
<div class="overlay" id="startScreen">
  <h1>TOWER DEFENSE</h1>
  <p>Stop the waves. Place towers. Upgrade. Survive.</p>
  <div>
    <button class="btn" id="lv1">LEVEL 1</button>
    <button class="btn secondary" id="lv2">LEVEL 2</button>
    <button class="btn secondary" id="lv3">LEVEL 3</button>
  </div>
  <button class="btn" id="startBtn">START</button>
  <p style="margin-top:1rem;font-size:.8rem;color:#64748b">Towers: Gun (fast) · Splash (area) · Slow (ice) · Sniper (long range)</p>
</div>
<div class="overlay" id="endScreen" style="display:none">
  <h1 id="endTitle">VICTORY</h1>
  <p id="endText">Score: 0</p>
  <button class="btn" id="retryBtn">PLAY AGAIN</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0c1220);
scene.fog=new THREE.FogExp2(0x0c1220,0.012);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,100);
camera.position.set(0,18,14);
camera.lookAt(0,0,0);
const clock=new THREE.Clock();
scene.add(new THREE.AmbientLight(0x445566,0.7));
const sun=new THREE.DirectionalLight(0xffffff,0.9);sun.position.set(10,25,10);scene.add(sun);

let audioCtx;
function ensureAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function beep(freq,dur,type,vol,slide){try{const ctx=ensureAudio();const o=ctx.createOscillator();const g=ctx.createGain();o.type=type||'square';o.frequency.setValueAtTime(freq,ctx.currentTime);if(slide)o.frequency.linearRampToValueAtTime(freq+slide,ctx.currentTime+dur);g.gain.setValueAtTime(vol||0.1,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+dur);}catch(e){}}
function noise(dur,vol){try{const ctx=ensureAudio();const n=ctx.createBufferSource();const buf=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);n.buffer=buf;const g=ctx.createGain();g.gain.value=vol||0.12;n.connect(g);g.connect(ctx.destination);n.start();}catch(e){}}
let musicOn=false;
function startMusic(){
  if(musicOn)return;musicOn=true;
  try{
    const ctx=ensureAudio();
    const g=ctx.createGain();g.gain.value=0.035;g.connect(ctx.destination);
    const notes=[130.8,164.8,196,246.9,196,164.8];
    let t=ctx.currentTime;
    function loop(){
      notes.forEach((f,i)=>{
        const o=ctx.createOscillator();o.type='triangle';o.frequency.value=f;
        const gg=ctx.createGain();gg.gain.setValueAtTime(0.04,t+i*0.5);gg.gain.exponentialRampToValueAtTime(0.001,t+i*0.5+0.45);
        o.connect(gg);gg.connect(g);o.start(t+i*0.5);o.stop(t+i*0.5+0.5);
      });
      t+=notes.length*0.5;
      if(state.running)setTimeout(loop,notes.length*500);
    }
    loop();
  }catch(e){}
}
const SFX={place:()=>beep(440,0.08,'square',0.1),shoot:()=>{noise(0.04,0.08);beep(800,0.04,'square',0.05,-200)},hit:()=>beep(600,0.05,'square',0.06,-100),kill:()=>beep(300,0.1,'square',0.08),wave:()=>beep(523,0.15,'square',0.1),lose:()=>beep(150,0.3,'sawtooth',0.12,-80),win:()=>{[523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,0.18,'square',0.1),i*120))}};

const TOWERS={
  gun:{name:'GUN',cost:50,range:4.5,dmg:12,rate:0.35,color:0x22c55e},
  splash:{name:'SPLASH',cost:80,range:3.8,dmg:18,rate:0.9,color:0xf97316,splash:1.6},
  slow:{name:'SLOW',cost:70,range:4.2,dmg:4,rate:0.5,color:0x38bdf8,slow:0.45},
  sniper:{name:'SNIPER',cost:120,range:7.5,dmg:45,rate:1.4,color:0xa78bfa}
};
const PATHS={
  1:[[-10,6],[-10,-2],[2,-2],[2,6],[10,6],[10,-6],[-8,-6],[-8,-10]],
  2:[[-12,8],[-4,8],[-4,-4],[6,-4],[6,4],[12,4],[12,-8],[-10,-8]],
  3:[[-14,0],[-8,6],[0,6],[0,-6],[8,-6],[8,4],[14,0],[8,-10],[-8,-10]]
};
const state={lives:20,gold:100,wave:0,score:0,level:1,running:false,waveActive:false,selected:'gun',spawnTimer:0,toSpawn:0,spawned:0};
const towers=[],enemies=[],projectiles=[],pathMeshes=[];
let pathPoints=[];

const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,30),new THREE.MeshStandardMaterial({color:0x1e293b}));
ground.rotation.x=-Math.PI/2;scene.add(ground);

function clearAll(){
  towers.forEach(t=>scene.remove(t.mesh));towers.length=0;
  enemies.forEach(e=>scene.remove(e.mesh));enemies.length=0;
  projectiles.forEach(p=>scene.remove(p.mesh));projectiles.length=0;
  pathMeshes.forEach(m=>scene.remove(m));pathMeshes.length=0;
}
function buildPath(lvl){
  pathPoints=PATHS[lvl].map(([x,z])=>new THREE.Vector3(x,0,z));
  for(let i=0;i<pathPoints.length-1;i++){
    const a=pathPoints[i],b=pathPoints[i+1];
    const mid=a.clone().add(b).multiplyScalar(0.5);
    const box=new THREE.Mesh(new THREE.BoxGeometry(Math.max(Math.abs(b.x-a.x),1.4),0.15,Math.max(Math.abs(b.z-a.z),1.4)),new THREE.MeshStandardMaterial({color:0x334155}));
    box.position.copy(mid).setY(0.08);
    scene.add(box);pathMeshes.push(box);
  }
}
function canPlace(x,z){
  for(const p of pathPoints){if(Math.hypot(x-p.x,z-p.z)<1.6)return false;}
  for(let i=0;i<pathPoints.length-1;i++){
    const a=pathPoints[i],b=pathPoints[i+1];
    const dx=b.x-a.x,dz=b.z-a.z,len=Math.hypot(dx,dz)||1;
    const t=Math.max(0,Math.min(1,((x-a.x)*dx+(z-a.z)*dz)/(len*len)));
    const px=a.x+t*dx,pz=a.z+t*dz;
    if(Math.hypot(x-px,z-pz)<1.5)return false;
  }
  for(const t of towers){if(Math.hypot(x-t.x,z-t.z)<1.4)return false;}
  return true;
}
function placeTower(x,z){
  const def=TOWERS[state.selected];
  if(state.gold<def.cost||!canPlace(x,z))return;
  state.gold-=def.cost;SFX.place();
  const mesh=new THREE.Group();
  const base=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.6,0.4,10),new THREE.MeshStandardMaterial({color:0x475569}));
  base.position.y=0.2;mesh.add(base);
  const top=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.28,0.7,8),new THREE.MeshStandardMaterial({color:def.color,emissive:def.color,emissiveIntensity:0.3}));
  top.position.y=0.7;mesh.add(top);
  mesh.position.set(x,0,z);scene.add(mesh);
  towers.push({mesh,x,z,type:state.selected,level:1,cooldown:0,range:def.range,dmg:def.dmg,rate:def.rate});
  updateHUD();
}
function upgradeTower(t){
  const cost=40*t.level;
  if(state.gold<cost)return;
  state.gold-=cost;t.level++;t.dmg*=1.35;t.range+=0.4;t.rate*=0.9;
  t.mesh.scale.setScalar(1+t.level*0.08);SFX.place();updateHUD();
}
function spawnEnemy(type){
  const hp=type==='boss'?180:type==='fast'?40:70;
  const spd=type==='fast'?2.8:type==='boss'?1.1:1.6;
  const color=type==='boss'?0xff6600:type==='fast'?0xfacc15:0xef4444;
  const mesh=new THREE.Mesh(new THREE.CapsuleGeometry(type==='boss'?0.45:0.3,type==='boss'?0.8:0.5,4,8),new THREE.MeshStandardMaterial({color}));
  mesh.position.copy(pathPoints[0]).setY(0.5);scene.add(mesh);
  enemies.push({mesh,hp,maxHp:hp,speed:spd,baseSpeed:spd,t:0,type,slow:0});
}
function startWave(){
  if(state.waveActive)return;
  state.wave++;state.waveActive=true;state.toSpawn=6+state.wave*3;state.spawned=0;state.spawnTimer=0;
  SFX.wave();document.getElementById('waveInfo').textContent='Wave '+state.wave+' incoming!';
  updateHUD();
}
function updateHUD(){
  document.getElementById('lives').textContent=state.lives;
  document.getElementById('gold').textContent=state.gold;
  document.getElementById('wave').textContent=state.wave;
  document.getElementById('score').textContent=state.score;
}
function endGame(win){
  state.running=false;state.waveActive=false;
  if(win)SFX.win();else SFX.lose();
  document.getElementById('endTitle').textContent=win?'VICTORY':'DEFEAT';
  document.getElementById('endText').textContent='Score: '+state.score+' · Wave '+state.wave;
  document.getElementById('endScreen').style.display='flex';
  document.getElementById('hud').style.display='none';
}

const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();
function onClick(e){
  if(!state.running)return;
  const r=canvas.getBoundingClientRect();
  const cx=e.clientX||e.changedTouches?.[0]?.clientX||0;
  const cy=e.clientY||e.changedTouches?.[0]?.clientY||0;
  mouse.x=(cx-r.left)/r.width*2-1;
  mouse.y=-(cy-r.top)/r.height*2+1;
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObject(ground);
  if(hits.length){
    const x=hits[0].point.x,z=hits[0].point.z;
    let hitT=null;
    for(const t of towers){if(Math.hypot(x-t.x,z-t.z)<0.8)hitT=t;}
    if(hitT)upgradeTower(hitT);
    else placeTower(x,z);
  }
}
canvas.addEventListener('click',onClick);
canvas.addEventListener('touchend',e=>{e.preventDefault();onClick(e.changedTouches[0]);},{passive:false});

document.querySelectorAll('.tower-btn').forEach(b=>{
  b.onclick=()=>{state.selected=b.dataset.t;document.querySelectorAll('.tower-btn').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');};
});
document.querySelector('.tower-btn').classList.add('sel');

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  if(state.running&&state.waveActive){
    state.spawnTimer-=dt;
    if(state.spawned<state.toSpawn&&state.spawnTimer<=0){
      const boss=state.wave%5===0&&state.spawned===state.toSpawn-1;
      const fast=Math.random()<0.25;
      spawnEnemy(boss?'boss':fast?'fast':'normal');
      state.spawned++;state.spawnTimer=boss?1.2:0.7;
    }
    if(state.spawned>=state.toSpawn&&enemies.length===0){
      state.waveActive=false;state.gold+=20+state.wave*5;state.score+=50;
      document.getElementById('waveInfo').textContent='Wave clear! Start next when ready';
      updateHUD();
      if(state.wave>=8+state.level*2)endGame(true);
    }
  }
  if(state.running){
    enemies.forEach(e=>{
      e.slow=Math.max(0,e.slow-dt);
      e.speed=e.slow>0?e.baseSpeed*0.45:e.baseSpeed;
      e.t+=e.speed*dt*0.15;
      const idx=Math.min(Math.floor(e.t*(pathPoints.length-1)),pathPoints.length-2);
      const local=(e.t*(pathPoints.length-1))-idx;
      const a=pathPoints[idx],b=pathPoints[idx+1]||a;
      e.mesh.position.lerpVectors(a,b,Math.min(1,local)).setY(0.5);
      if(e.t>=1){scene.remove(e.mesh);state.lives--;SFX.hit();updateHUD();if(state.lives<=0)endGame(false);}
    });
    for(let i=enemies.length-1;i>=0;i--){if(enemies[i].t>=1||enemies[i].hp<=0){if(enemies[i].hp<=0){state.gold+=enemies[i].type==='boss'?40:8;state.score+=enemies[i].type==='boss'?100:10;SFX.kill();}enemies.splice(i,1);}}
    towers.forEach(t=>{
      t.cooldown-=dt;
      if(t.cooldown>0)return;
      let best=null,bd=1e9;
      enemies.forEach(e=>{
        const d=Math.hypot(e.mesh.position.x-t.x,e.mesh.position.z-t.z);
        if(d<t.range&&d<bd){bd=d;best=e;}
      });
      if(best){
        t.cooldown=t.rate;SFX.shoot();
        const def=TOWERS[t.type];
        if(def.splash){
          enemies.forEach(e=>{if(Math.hypot(e.mesh.position.x-best.mesh.position.x,e.mesh.position.z-best.mesh.position.z)<def.splash)e.hp-=t.dmg;});
        }else best.hp-=t.dmg;
        if(def.slow)best.slow=1.2;
        const p=new THREE.Mesh(new THREE.SphereGeometry(0.08,6,6),new THREE.MeshBasicMaterial({color:def.color}));
        p.position.set(t.x,0.8,t.z);scene.add(p);
        projectiles.push({mesh:p,tx:best.mesh.position.x,tz:best.mesh.position.z,life:0.2});
      }
    });
    for(let i=projectiles.length-1;i>=0;i--){
      const p=projectiles[i];p.mesh.position.lerp(new THREE.Vector3(p.tx,0.5,p.tz),0.3);p.life-=dt;
      if(p.life<=0){scene.remove(p.mesh);projectiles.splice(i,1);}
    }
  }
  renderer.render(scene,camera);
}
animate();

function startLevel(n){
  ensureAudio();startMusic();
  state.level=n;state.lives=20;state.gold=100+n*20;state.wave=0;state.score=0;state.running=true;state.waveActive=false;
  clearAll();buildPath(n);
  document.getElementById('startScreen').style.display='none';
  document.getElementById('endScreen').style.display='none';
  document.getElementById('hud').style.display='block';
  document.getElementById('waveBtn').style.display='inline-block';
  updateHUD();
}
document.getElementById('lv1').onclick=()=>{state.level=1;flash(1);};
document.getElementById('lv2').onclick=()=>{state.level=2;flash(2);};
document.getElementById('lv3').onclick=()=>{state.level=3;flash(3);};
function flash(n){['lv1','lv2','lv3'].forEach((id,i)=>document.getElementById(id).classList.toggle('secondary',i+1!==n));document.getElementById('startBtn').textContent='START LEVEL '+n;}
document.getElementById('startBtn').onclick=()=>startLevel(state.level);
document.getElementById('waveBtn').onclick=startWave;
document.getElementById('retryBtn').onclick=()=>{document.getElementById('endScreen').style.display='none';document.getElementById('startScreen').style.display='flex';};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
