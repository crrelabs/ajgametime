    desc: 'Swing a wrecking ball to demolish buildings! Time your release and smash every block!',
    category: 'Arcade', emoji: '🏗️💥',
    bg: 'linear-gradient(135deg, #1c1917, #f97316)',
    tagBg: 'rgba(249,115,22,0.2)', tagColor: '#fb923c',
    btnBg: 'linear-gradient(135deg, #f97316, #ef4444)'
  },
  {
    id: 'snakesladders', name: 'Snakes & Ladders', href: 'snakes-ladders.html',
    desc: 'Classic board game! Roll dice, climb ladders, avoid snakes. Race to square 100!',
    category: 'Board Game', emoji: '🐍🪜',
    bg: 'linear-gradient(135deg, #667eea, #764ba2)',
    tagBg: 'rgba(102,126,234,0.2)', tagColor: '#818cf8',
    btnBg: 'linear-gradient(135deg, #667eea, #764ba2)'
  },
  {
    id: 'baconflip', name: 'Bacon Flip', href: 'bacon-flip.html',
    desc: 'Flip bacon onto random objects and enjoy opera music when you land! Endless levels of crispy fun.',
    category: 'Arcade', emoji: '🥓🎵',
    bg: 'linear-gradient(135deg, #7c2d12, #c2410c)',
    tagBg: 'rgba(249,115,22,0.2)', tagColor: '#fb923c',
    btnBg: 'linear-gradient(135deg, #ea580c, #f97316)'
  }
];

let currentFilter = 'all';

function renderGames() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  let games = GAMES.filter(g => {
    if (currentFilter !== 'all' && g.category !== currentFilter) return false;
    if (query) {
      const haystack = (g.name + ' ' + g.desc + ' ' + g.category).toLowerCase();
      return haystack.includes(query);
    }
    return true;
  });

  document.getElementById('gameCount').textContent = `${games.length} game${games.length !== 1 ? 's' : ''}`;

  const grid = document.getElementById('gamesGrid');
  const noResults = document.getElementById('noResults');

  if (games.length === 0) {
    grid.innerHTML = '';
    noResults.classList.add('visible');
    return;
  }
  noResults.classList.remove('visible');

  if (currentFilter === 'all' && !query) {
    const cats = {};
    games.forEach(g => {
      if (!cats[g.category]) cats[g.category] = [];
      cats[g.category].push(g);
    });
    const catEmojis = {
      'Puzzle':'🧠','Racing':'🚗','Arcade':'🎯','Action':'⚡','Sports':'🏀',
      'Adventure':'🗺️','Strategy':'♟️','Tycoon':'💰','Shooter':'🚀','Board Game':'🎲'
    };
    let html = '';
    Object.keys(cats).sort().forEach(cat => {
      html += `<div class="cat-header">${catEmojis[cat]||'🎮'} ${cat} Games</div>`;
      cats[cat].forEach(g => {
        html += cardHTML(g);
      });
    });
    grid.innerHTML = html;
  } else {
    grid.innerHTML = games.map(cardHTML).join('');
  }
}

function cardHTML(g) {
  return `
    <a href="${g.href}" class="game-card">
      <div class="card-preview" style="background:${g.bg}">${g.emoji}</div>
      <div class="card-body">
        <h3>${g.name}</h3>
        <p>${g.desc}</p>
        <span class="card-tag" style="background:${g.tagBg};color:${g.tagColor}">${g.category}</span>
      </div>
      <div class="play-btn" style="background:${g.btnBg}">▶ Play Now</div>
    </a>`;
}

document.getElementById('searchInput').addEventListener('input', renderGames);

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderGames();
  });
});

renderGames();
</script>
