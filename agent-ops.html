<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Agent Ops — AJ GameTime</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a12;font-family:Nunito,sans-serif;color:#e2e8f0;touch-action:none}
#game-container{width:100%;height:100%;position:relative}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none;z-index:10}
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:22px;height:22px;opacity:.85}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:#22c55e}
#crosshair::before{width:2px;height:100%;left:50%;transform:translateX(-50%)}
#crosshair::after{height:2px;width:100%;top:50%;transform:translateY(-50%)}
#health-bar{position:absolute;bottom:20px;left:16px;width:140px;height:16px;background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.2);border-radius:10px;overflow:hidden}
#health-fill{height:100%;width:100%;background:linear-gradient(90deg,#ef4444,#22c55e);transition:width .2s}
#health-text{position:absolute;bottom:40px;left:16px;font-weight:800;font-size:.75rem;color:#94a3b8}
#ammo{position:absolute;bottom:20px;right:16px;font-family:'Lilita One',cursive;font-size:1.3rem;color:#fbbf24;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#score{position:absolute;top:16px;right:16px;font-family:'Lilita One',cursive;font-size:1.2rem;color:#22d3ee}
#objective{position:absolute;top:16px;left:16px;max-width:260px;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.1);font-size:.8rem;font-weight:700}
#objective span{color:#4ade80}
#weapon-hud{position:absolute;bottom:52px;right:16px;font-size:.75rem;font-weight:800;color:#94a3b8}
#minimap{position:absolute;top:50px;right:16px;width:120px;height:120px;background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.2);border-radius:8px;z-index:11}
#damage-flash{position:absolute;inset:0;background:rgba(239,68,68,.35);opacity:0;transition:opacity .15s;pointer-events:none}
.overlay{position:absolute;inset:0;background:rgba(10,10,18,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;text-align:center;padding:20px}
.overlay h1{font-family:'Lilita One',cursive;font-size:clamp(2rem,8vw,3.2rem);background:linear-gradient(135deg,#22c55e,#06b6d4,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.4rem}
.overlay p{color:#94a3b8;max-width:440px;margin:.4rem 0 1.2rem;line-height:1.45;font-size:.95rem}
.btn{display:inline-block;padding:14px 32px;margin:6px;font-family:'Lilita One',cursive;font-size:1.15rem;color:#fff;background:linear-gradient(135deg,#22c55e,#06b6d4);border:none;border-radius:14px;cursor:pointer;box-shadow:0 4px 20px rgba(34,197,94,.35);-webkit-tap-highlight-color:transparent}
.btn.secondary{background:linear-gradient(135deg,#7c3aed,#3b82f6);box-shadow:0 4px 20px rgba(124,58,237,.35)}
.controls-hint{margin-top:1.2rem;font-size:.8rem;color:#64748b;line-height:1.6}
#mobile-controls{display:none;position:absolute;inset:0;pointer-events:none;z-index:15}
#mobile-controls.show{display:block}
.joy-base{position:absolute;bottom:28px;left:24px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);pointer-events:auto;touch-action:none}
.joy-stick{position:absolute;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.4);top:37px;left:37px;pointer-events:none}
.fire-btn{position:absolute;bottom:36px;right:28px;width:88px;height:88px;border-radius:50%;background:rgba(239,68,68,.55);border:3px solid #ef4444;pointer-events:auto;display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:#fff;font-weight:800;touch-action:none;user-select:none}
.look-hint{position:absolute;top:50%;right:20px;transform:translateY(-50%);writing-mode:vertical-rl;font-size:.7rem;color:rgba(255,255,255,.25);pointer-events:none;letter-spacing:1px}
</style>
</head>
<body>
<div id="game-container">
<canvas id="c"></canvas>
<div id="hud" style="display:none">
  <div id="crosshair"></div>
  <div id="objective">🎯 <span id="obj-text">Eliminate all targets</span></div>
  <div id="score">SCORE: 0</div>
  <canvas id="minimap" width="120" height="120"></canvas>
  <div id="health-text">HEALTH</div>
  <div id="health-bar"><div id="health-fill"></div></div>
  <div id="ammo">30 / 30</div>
  <div id="weapon-hud">PISTOL [1]</div>
  <div id="damage-flash"></div>
</div>
<div id="mobile-controls">
  <div class="joy-base" id="joy"><div class="joy-stick" id="stick"></div></div>
  <div class="fire-btn" id="fireBtn">FIRE</div>
  <div class="look-hint">DRAG TO LOOK</div>
</div>
<div class="overlay" id="startScreen">
  <h1>AGENT OPS</h1>
  <p>Complete missions. Eliminate targets. Stay alive.<br>Pick a mission, then start.</p>
  <div>
    <button class="btn" id="m1">MISSION 1</button>
    <button class="btn secondary" id="m2">MISSION 2</button>
    <button class="btn secondary" id="m3">MISSION 3</button>
  </div>
  <button class="btn" id="startBtn">START MISSION</button>
  <div class="controls-hint" id="controlsHint">
    <b>Keyboard:</b> WASD move · Mouse look · Click or Space shoot · R reload · 1/2/3 weapons · Shift sprint
  </div>
</div>
<div class="overlay" id="endScreen" style="display:none">
  <h1 id="endTitle">MISSION COMPLETE</h1>
  <p id="endText">Score: 0</p>
  <button class="btn" id="retryBtn">NEXT / RETRY</button>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0a0a12);
scene.fog=new THREE.FogExp2(0x0a0a12,0.025);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,100);
const clock=new THREE.Clock();
scene.add(new THREE.AmbientLight(0x334455,0.6));
const sun=new THREE.DirectionalLight(0xffffff,0.8);sun.position.set(10,20,10);scene.add(sun);

const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
let audioCtx;
function ensureAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function beep(freq,dur,type,vol,slide){try{const ctx=ensureAudio();const o=ctx.createOscillator();const g=ctx.createGain();o.type=type||'square';o.frequency.setValueAtTime(freq,ctx.currentTime);if(slide)o.frequency.linearRampToValueAtTime(freq+slide,ctx.currentTime+dur);g.gain.setValueAtTime(vol||0.12,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+dur);}catch(e){}}
function noiseBurst(dur,vol){try{const ctx=ensureAudio();const n=ctx.createBufferSource();const buf=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate);const data=buf.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(1-i/data.length);n.buffer=buf;const g=ctx.createGain();g.gain.value=vol||0.15;n.connect(g);g.connect(ctx.destination);n.start();}catch(e){}}
const SFX={shoot:()=>{noiseBurst(0.06,0.18);beep(180,0.05,'square',0.06,-80)},hit:()=>beep(600,0.06,'square',0.1,-200),hurt:()=>beep(120,0.15,'sawtooth',0.14,-40),kill:()=>{beep(400,0.08,'square',0.1);setTimeout(()=>beep(280,0.12,'square',0.08),60)},reload:()=>beep(220,0.08,'triangle',0.08),win:()=>{[523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,0.2,'square',0.1),i*120))},lose:()=>{beep(200,0.25,'sawtooth',0.12,-100)}};

const WEAPONS={
  1:{name:'PISTOL',dmg:22,rate:280,ammo:12,spread:0.01},
  2:{name:'SMG',dmg:12,rate:90,ammo:30,spread:0.04},
  3:{name:'SHOTGUN',dmg:10,rate:650,ammo:6,spread:0.12,pellets:6}
};
const state={health:100,score:0,ammo:12,maxAmmo:12,enemiesAlive:0,totalEnemies:0,gameActive:false,isReloading:false,keys:{},velocity:new THREE.Vector3(),lastShot:0,weapon:1,mission:1,objective:'kill',surviveTime:0,extract:null,lookYaw:0,lookPitch:0,moveX:0,moveZ:0,invulnUntil:0};
const walls=[],enemies=[],bullets=[];
const wallMat=new THREE.MeshStandardMaterial({color:0x1e293b,roughness:0.8});
const floorMat=new THREE.MeshStandardMaterial({color:0x111827,roughness:0.9});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(50,50),floorMat);floor.rotation.x=-Math.PI/2;scene.add(floor);

function addBox(w,h,d,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),wallMat);m.position.set(x,y,z);scene.add(m);walls.push(m);return m;}
function clearLevel(){walls.forEach(w=>scene.remove(w));walls.length=0;enemies.forEach(e=>scene.remove(e));enemies.length=0;bullets.forEach(b=>scene.remove(b));bullets.length=0;}
function createEnemy(x,z,hp,spd){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.32,0.85,4,8),new THREE.MeshStandardMaterial({color:0xef4444}));
  body.position.y=0.95;g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.26,10,10),new THREE.MeshStandardMaterial({color:0xfca5a5}));
  head.position.y=1.75;g.add(head);
  g.position.set(x,0,z);
  g.userData={health:hp||40,speed:spd||1.4,alive:true,shootCooldown:1};
  scene.add(g);enemies.push(g);
}
function buildMission(n){
  clearLevel();
  state.mission=n;
  state.surviveTime=0;
  state.extract=null;
  if(n===1){
    state.objective='kill';
    addBox(2,3,8,-8,1.5,0);addBox(2,3,8,8,1.5,0);addBox(6,3,2,0,1.5,-8);
    createEnemy(-6,-4);createEnemy(6,-2);createEnemy(0,-10);createEnemy(4,6);
  }else if(n===2){
    state.objective='survive';
    addBox(1.5,3,12,-6,1.5,0);addBox(1.5,3,12,6,1.5,0);addBox(10,3,1.5,0,1.5,-6);
    createEnemy(-10,-6,50,1.6);createEnemy(10,-4,45,1.5);createEnemy(-4,-12,40,1.7);createEnemy(4,8,40,1.5);createEnemy(0,-2,55,1.3);
  }else{
    state.objective='extract';
    addBox(3,3,3,-10,1.5,-8);addBox(3,3,3,10,1.5,-8);addBox(3,3,3,-10,1.5,8);addBox(3,3,3,10,1.5,8);
    addBox(14,3,1,0,1.5,0);
    createEnemy(-8,-10,60,1.8);createEnemy(8,-10,60,1.8);createEnemy(-8,10,55,1.6);createEnemy(8,10,55,1.6);createEnemy(0,-14,80,1.4);createEnemy(0,12,70,1.5);
    const mark=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,0.2,16),new THREE.MeshStandardMaterial({color:0x22c55e,emissive:0x22c55e,emissiveIntensity:0.6}));
    mark.position.set(0,0.1,-16);scene.add(mark);
    state.extract=mark;
  }
  state.totalEnemies=enemies.length;
  state.enemiesAlive=enemies.length;
  updateObjective();
}
const raycaster=new THREE.Raycaster();
const bulletMat=new THREE.MeshBasicMaterial({color:0xffff88});
function getLookDirection(){
  if(isTouch){
    const dir=new THREE.Vector3(0,0,-1);
    dir.applyEuler(new THREE.Euler(state.lookPitch,state.lookYaw,0,'YXZ'));
    return dir;
  }
  const dir=new THREE.Vector3(0,0,-1);
  dir.applyQuaternion(camera.quaternion);
  return dir;
}
function hasLineOfSight(from,to){
  const dir=to.clone().sub(from);
  const dist=dir.length();
  raycaster.set(from,dir.normalize());
  raycaster.far=dist;
  const hits=raycaster.intersectObjects(walls);
  return hits.length===0;
}
function shoot(){
  if(!state.gameActive||state.isReloading)return;
  const w=WEAPONS[state.weapon];
  if(state.ammo<=0){reload();return;}
  const now=performance.now();
  if(now-state.lastShot<w.rate)return;
  state.lastShot=now;state.ammo--;updateHUD();SFX.shoot();
  const pellets=w.pellets||1;
  for(let p=0;p<pellets;p++){
    const dir=getLookDirection();
    dir.x+=(Math.random()-0.5)*w.spread;
    dir.y+=(Math.random()-0.5)*w.spread;
    dir.z+=(Math.random()-0.5)*w.spread;
    dir.normalize();
    raycaster.set(camera.position,dir);raycaster.far=40;
    const targets=enemies.filter(e=>e.userData.alive);
    const hits=raycaster.intersectObjects(targets,true);
    if(hits.length>0){
      let enemy=hits[0].object;
      while(enemy.parent&&!enemy.userData?.alive)enemy=enemy.parent;
      if(enemy.userData?.alive){
        const enemyPos=enemy.position.clone().setY(1.2);
        if(hasLineOfSight(camera.position,enemyPos)){
          enemy.userData.health-=w.dmg;SFX.hit();
          if(enemy.userData.health<=0)killEnemy(enemy);
        }
      }
    }
    const b=new THREE.Mesh(new THREE.SphereGeometry(0.05,6,6),bulletMat);
    b.position.copy(camera.position).add(dir.clone().multiplyScalar(1.2));
    b.userData={dir:dir.clone(),life:0.3};scene.add(b);bullets.push(b);
  }
}
function killEnemy(enemy){enemy.userData.alive=false;state.enemiesAlive--;state.score+=100;enemy.rotation.x=-Math.PI/2;enemy.position.y=0.2;SFX.kill();updateHUD();updateObjective();if(state.objective==='kill'&&state.enemiesAlive<=0)endGame(true);}
function reload(){if(state.isReloading||state.ammo===state.maxAmmo)return;state.isReloading=true;SFX.reload();document.getElementById('ammo').textContent='RELOAD...';setTimeout(()=>{state.ammo=state.maxAmmo;state.isReloading=false;updateHUD();},1000);}
function takeDamage(amt){if(performance.now()<state.invulnUntil)return;state.health=Math.max(0,state.health-amt);SFX.hurt();updateHUD();const f=document.getElementById('damage-flash');f.style.opacity='1';setTimeout(()=>f.style.opacity='0',140);if(state.health<=0)endGame(false);}
function updateHUD(){document.getElementById('health-fill').style.width=state.health+'%';document.getElementById('score').textContent='SCORE: '+state.score;if(!state.isReloading)document.getElementById('ammo').textContent=state.ammo+' / '+state.maxAmmo;document.getElementById('weapon-hud').textContent=WEAPONS[state.weapon].name+' ['+state.weapon+']';}
function updateObjective(){
  if(state.objective==='survive'){
    const left=Math.max(0,45-state.surviveTime);
    document.getElementById('obj-text').textContent=`Survive: ${left.toFixed(0)}s remaining`;
  }else if(state.objective==='extract'){
    const left=state.enemiesAlive;
    document.getElementById('obj-text').textContent=left>0?`Clear path then extract (${left} left)`:'Reach the green zone!';
  }else{
    const left=state.enemiesAlive;
    document.getElementById('obj-text').textContent=left>0?`Eliminate targets (${state.totalEnemies-left}/${state.totalEnemies})`:'All clear!';
  }
}
function switchWeapon(n){if(!WEAPONS[n])return;state.weapon=n;const w=WEAPONS[n];state.maxAmmo=w.ammo;state.ammo=w.ammo;updateHUD();}
function startGame(){
  ensureAudio();
  document.getElementById('startScreen').style.display='none';
  document.getElementById('endScreen').style.display='none';
  document.getElementById('hud').style.display='block';
  state.gameActive=true;state.health=100;state.score=0;
  switchWeapon(state.weapon);
  state.lookYaw=0;state.lookPitch=0;
  state.invulnUntil=performance.now()+2000;
  camera.position.set(0,1.6,16);camera.rotation.set(0,0,0);
  buildMission(state.mission);
  updateHUD();updateObjective();
  if(isTouch)document.getElementById('mobile-controls').classList.add('show');
  else controls.lock();
}
function endGame(win){
  state.gameActive=false;
  if(win)SFX.win();else SFX.lose();
  document.getElementById('endTitle').textContent=win?'MISSION COMPLETE':'MISSION FAILED';
  document.getElementById('endText').textContent='Score: '+state.score+' · Mission '+state.mission;
  document.getElementById('endScreen').style.display='flex';
  document.getElementById('mobile-controls').classList.remove('show');
  if(controls.isLocked)controls.unlock();
}

const controls={locked:false,lock(){canvas.requestPointerLock();},unlock(){document.exitPointerLock();},get isLocked(){return document.pointerLockElement===canvas;}};
document.addEventListener('mousemove',e=>{
  if(!state.gameActive||isTouch||!controls.isLocked)return;
  camera.rotation.order='YXZ';
  camera.rotation.y-=e.movementX*0.002;
  camera.rotation.x-=e.movementY*0.002;
  camera.rotation.x=Math.max(-1.4,Math.min(1.4,camera.rotation.x));
});
document.addEventListener('keydown',e=>{
  state.keys[e.code]=true;
  if(e.code==='KeyR')reload();
  if(e.code==='Space')shoot();
  if(e.code==='Digit1')switchWeapon(1);
  if(e.code==='Digit2')switchWeapon(2);
  if(e.code==='Digit3')switchWeapon(3);
});
document.addEventListener('keyup',e=>state.keys[e.code]=false);
canvas.addEventListener('click',()=>{if(state.gameActive&&!isTouch){if(!controls.isLocked)controls.lock();else shoot();}});

const joy=document.getElementById('joy'),stick=document.getElementById('stick');
let joyId=null;
joy.addEventListener('touchstart',e=>{e.preventDefault();joyId=e.changedTouches[0].identifier;moveJoy(e.changedTouches[0]);},{passive:false});
joy.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===joyId)moveJoy(t);},{passive:false});
function moveJoy(t){const r=joy.getBoundingClientRect();const dx=t.clientX-(r.left+r.width/2);const dy=t.clientY-(r.top+r.height/2);const max=40;const len=Math.hypot(dx,dy);const cdx=len>max?dx/len*max:dx;const cdy=len>max?dy/len*max:dy;stick.style.transform=`translate(${cdx}px,${cdy}px)`;state.moveX=cdx/max;state.moveZ=-cdy/max;}
function endJoy(){joyId=null;state.moveX=0;state.moveZ=0;stick.style.transform='translate(0,0)';}
joy.addEventListener('touchend',endJoy);joy.addEventListener('touchcancel',endJoy);
document.getElementById('fireBtn').addEventListener('touchstart',e=>{e.preventDefault();shoot();},{passive:false});
let lookTouch=null;
canvas.addEventListener('touchstart',e=>{if(e.target===canvas&&state.gameActive){lookTouch=e.changedTouches[0].identifier;}},{passive:false});
canvas.addEventListener('touchmove',e=>{
  if(!state.gameActive)return;
  for(const t of e.changedTouches){
    if(t.identifier===lookTouch){
      state.lookYaw-=(t.clientX-(t._lx||t.clientX))*0.004;
      state.lookPitch-=(t.clientY-(t._ly||t.clientY))*0.004;
      state.lookPitch=Math.max(-1.2,Math.min(1.2,state.lookPitch));
      t._lx=t.clientX;t._ly=t.clientY;
    }
  }
},{passive:false});

function collides(pos){const r=0.45;for(const w of walls){const b=new THREE.Box3().setFromObject(w);b.expandByScalar(r);b.min.y=0;b.max.y=4;if(b.containsPoint(pos))return true;}if(Math.abs(pos.x)>22||Math.abs(pos.z)>22)return true;return false;}

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  if(state.gameActive){
    const mm=document.getElementById('minimap');
    if(mm){
      const ctx=mm.getContext('2d');
      ctx.clearRect(0,0,120,120);
      ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(0,0,120,120);
      const scale=2.2;const cx=60,cy=60;
      ctx.fillStyle='#22c55e';ctx.beginPath();ctx.arc(cx,cy,4,0,Math.PI*2);ctx.fill();
      enemies.forEach(e=>{
        if(!e.userData.alive)return;
        const dx=(e.position.x-camera.position.x)*scale;
        const dz=(e.position.z-camera.position.z)*scale;
        if(Math.abs(dx)<55&&Math.abs(dz)<55){ctx.fillStyle='#ef4444';ctx.fillRect(cx+dx-2,cy+dz-2,4,4);}
      });
      if(state.extract){
        const dx=(state.extract.position.x-camera.position.x)*scale;
        const dz=(state.extract.position.z-camera.position.z)*scale;
        ctx.fillStyle='#22d3ee';ctx.fillRect(cx+dx-3,cy+dz-3,6,6);
      }
    }
    if(state.objective==='survive'){state.surviveTime+=dt;updateObjective();if(state.surviveTime>=45)endGame(true);}
    if(state.objective==='extract'&&state.enemiesAlive<=0&&state.extract){const d=camera.position.distanceTo(state.extract.position);if(d<2.2)endGame(true);}
    if(isTouch){camera.rotation.order='YXZ';camera.rotation.y=state.lookYaw;camera.rotation.x=state.lookPitch;}
    const speed=(state.keys['ShiftLeft']||state.keys['ShiftRight'])?6.5:4.2;
    state.velocity.x*=(1-12*dt);state.velocity.z*=(1-12*dt);
    let inputX=0,inputZ=0;
    if(isTouch){inputX=state.moveX;inputZ=state.moveZ;}
    else{inputZ=Number(state.keys['KeyW'])-Number(state.keys['KeyS']);inputX=Number(state.keys['KeyD'])-Number(state.keys['KeyA']);}
    if(inputX||inputZ){
      const len=Math.hypot(inputX,inputZ)||1;inputX/=len;inputZ/=len;
      const yaw=isTouch?state.lookYaw:camera.rotation.y;
      const forward=new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);
      const right=new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);
      state.velocity.add(forward.multiplyScalar(inputZ*speed*14*dt));
      state.velocity.add(right.multiplyScalar(inputX*speed*14*dt));
    }
    const old=camera.position.clone();
    camera.position.x+=state.velocity.x*dt;
    camera.position.z+=state.velocity.z*dt;
    camera.position.y=1.6;
    if(collides(camera.position)){camera.position.copy(old);state.velocity.set(0,0,0);}
    enemies.forEach(e=>{
      if(!e.userData.alive)return;
      const toP=new THREE.Vector3().subVectors(camera.position,e.position);
      const dist=toP.length();toP.y=0;
      if(dist<18){
        e.lookAt(camera.position.x,e.position.y,camera.position.z);
        if(dist>3.2){toP.normalize().multiplyScalar(e.userData.speed*dt);const next=e.position.clone().add(toP);if(!collides(next))e.position.copy(next);}
        e.userData.shootCooldown-=dt;
        if(dist<12&&e.userData.shootCooldown<=0){
          const from=e.position.clone().setY(1.4);
          if(hasLineOfSight(from,camera.position.clone())){
            e.userData.shootCooldown=1.3+Math.random()*0.7;
            if(Math.random()>0.4)takeDamage(6+Math.random()*4);
          }else e.userData.shootCooldown=0.5;
        }
      }
    });
    for(let i=bullets.length-1;i>=0;i--){
      const b=bullets[i];b.position.addScaledVector(b.userData.dir,50*dt);b.userData.life-=dt;
      if(b.userData.life<=0){scene.remove(b);bullets.splice(i,1);}
    }
  }
  renderer.render(scene,camera);
}
animate();

document.getElementById('m1').onclick=()=>{state.mission=1;flashMission(1);};
document.getElementById('m2').onclick=()=>{state.mission=2;flashMission(2);};
document.getElementById('m3').onclick=()=>{state.mission=3;flashMission(3);};
function flashMission(n){document.querySelectorAll('#startScreen .btn').forEach(b=>b.classList.add('secondary'));document.getElementById('m'+n).classList.remove('secondary');document.getElementById('startBtn').textContent='START MISSION '+n;}
document.getElementById('startBtn').onclick=startGame;
document.getElementById('retryBtn').onclick=()=>{document.getElementById('endScreen').style.display='none';document.getElementById('startScreen').style.display='flex';};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
if(isTouch)document.getElementById('controlsHint').innerHTML='🕹️ Left stick = Move<br>👆 Drag screen = Look<br>🔴 FIRE = Shoot';
</script>
