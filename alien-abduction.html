<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Alien Abduction — AJ GameTime</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Nunito:wght@600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:Nunito,sans-serif;color:#e2e8f0;touch-action:none}
#c{display:block;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none;z-index:10}
#top{position:absolute;top:12px;left:12px;display:flex;gap:8px;flex-wrap:wrap}
.stat{background:rgba(15,23,42,.85);padding:8px 14px;border-radius:10px;font-family:Orbitron,sans-serif;font-size:.8rem;border:1px solid #22d3ee;color:#67e8f9}
.stat span{color:#fff}
#beamBar{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);width:160px;height:8px;background:#1e293b;border-radius:4px;border:1px solid #22d3ee;overflow:hidden}
#beamFill{height:100%;width:0%;background:linear-gradient(90deg,#22d3ee,#a855f7)}
#hint{position:absolute;bottom:16px;left:16px;font-size:.7rem;color:#94a3b8;background:rgba(15,23,42,.75);padding:5px 8px;border-radius:6px}
#upgradeBtn{position:absolute;top:16px;right:16px;pointer-events:auto;padding:10px 16px;font-family:Orbitron,sans-serif;background:linear-gradient(135deg,#7c3aed,#22d3ee);border:none;border-radius:12px;color:#fff;cursor:pointer;font-size:.8rem}
#joy{position:absolute;bottom:30px;left:30px;width:120px;height:120px;pointer-events:auto;z-index:20;display:none}
#joyBase{width:120px;height:120px;border-radius:50%;background:rgba(15,23,42,.6);border:2px solid #22d3ee;position:relative}
#joyStick{width:50px;height:50px;border-radius:50%;background:#22d3ee;position:absolute;left:35px;top:35px;box-shadow:0 0 15px #22d3ee}
.overlay{position:absolute;inset:0;background:rgba(2,6,23,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;text-align:center;padding:20px}
.overlay h1{font-family:Orbitron,sans-serif;font-size:clamp(1.8rem,7vw,3.2rem);background:linear-gradient(135deg,#22d3ee,#a855f7,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.4rem}
.overlay p{max-width:520px;margin:.4rem 0 1rem;line-height:1.45;color:#94a3b8;font-size:.9rem}
.btn{display:inline-block;padding:12px 24px;margin:6px;font-family:Orbitron,sans-serif;font-size:.95rem;color:#fff;background:linear-gradient(135deg,#7c3aed,#22d3ee);border:none;border-radius:12px;cursor:pointer}
#shop{position:absolute;inset:0;background:rgba(2,6,23,.94);z-index:40;display:none;flex-direction:column;align-items:center;padding:16px;overflow-y:auto}
#shop h2{font-family:Orbitron,sans-serif;margin-bottom:10px;color:#22d3ee}
.upgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;max-width:880px;width:100%}
.upcard{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:10px}
.upcard h4{font-family:Orbitron,sans-serif;font-size:.75rem;color:#67e8f9;margin-bottom:3px}
.upcard p{font-size:.7rem;color:#94a3b8;margin-bottom:6px}
.upcard button{width:100%;padding:6px;font-family:Orbitron,sans-serif;background:#22d3ee;color:#020617;border:none;border-radius:6px;cursor:pointer;font-size:.75rem;font-weight:700}
.upcard button:disabled{background:#334155;color:#64748b}
#time{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-family:Orbitron,sans-serif;font-size:.8rem;background:rgba(15,23,42,.8);padding:6px 12px;border-radius:8px;border:1px solid #22d3ee}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" style="display:none">
  <div id="top">
    <div class="stat">SCORE <span id="score">0</span></div>
    <div class="stat">CREDITS <span id="credits">0</span></div>
    <div class="stat">ABDUCTED <span id="abducted">0</span></div>
    <div class="stat">HP <span id="hp">100</span></div>
  </div>
  <div id="time">DAY 12:00</div>
  <button id="upgradeBtn">UPGRADES</button>
  <div id="beamBar"><div id="beamFill"></div></div>
  <div id="hint">WASD or Joystick · Hold SPACE / Beam button to abduct</div>
  <div id="joy"><div id="joyBase"><div id="joyStick"></div></div></div>
</div>
<div class="overlay" id="startScreen">
  <h1>ALIEN ABDUCTION</h1>
  <p>Day & night city. Beam up people & cars. Dodge helicopters. Mobile joystick + tons of upgrades.</p>
  <button class="btn" id="startBtn">START</button>
</div>
<div class="overlay" id="endScreen" style="display:none">
  <h1>SHIP DESTROYED</h1>
  <p id="endText">Score: 0</p>
  <button class="btn" id="retryBtn">RETRY</button>
</div>
<div id="shop">
  <h2>UPGRADES</h2>
  <p style="margin-bottom:8px">Credits: <span id="shopCredits">0</span></p>
  <div class="upgrid" id="upgrid"></div>
  <button class="btn" id="closeShop">RESUME</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,0.1,180);
camera.position.set(0,32,20);
camera.lookAt(0,0,0);
const clock=new THREE.Clock();

const ambient=new THREE.AmbientLight(0xffffff,0.55);
scene.add(ambient);
const sun=new THREE.DirectionalLight(0xfff5e0,1.1);
sun.position.set(30,40,15);sun.castShadow=true;scene.add(sun);
const moon=new THREE.DirectionalLight(0x93c5fd,0.15);
moon.position.set(-20,30,-10);scene.add(moon);

let audioCtx;
function ensureAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function beep(f,d,t,v,s){try{const c=ensureAudio();const o=c.createOscillator();const g=c.createGain();o.type=t||'sine';o.frequency.setValueAtTime(f,c.currentTime);if(s)o.frequency.linearRampToValueAtTime(f+s,c.currentTime+d);g.gain.setValueAtTime(v||0.07,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d);}catch(e){}}
function scream(){try{const c=ensureAudio();const o=c.createOscillator();const g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(160+Math.random()*60,c.currentTime);o.frequency.linearRampToValueAtTime(380+Math.random()*100,c.currentTime+0.12);o.frequency.linearRampToValueAtTime(70,c.currentTime+0.4);g.gain.setValueAtTime(0.1,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.45);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+0.45);}catch(e){}}
function noise(d,v){try{const c=ensureAudio();const n=c.createBufferSource();const b=c.createBuffer(1,c.sampleRate*d,c.sampleRate);const dat=b.getChannelData(0);for(let i=0;i<dat.length;i++)dat[i]=(Math.random()*2-1)*(1-i/dat.length);n.buffer=b;const g=c.createGain();g.gain.value=v||0.07;n.connect(g);g.connect(c.destination);n.start();}catch(e){}}
let musicOn=false;
function startMusic(){if(musicOn)return;musicOn=true;try{const c=ensureAudio();const g=c.createGain();g.gain.value=0.03;g.connect(c.destination);const notes=[55,65,73,82];let t=c.currentTime;function loop(){notes.forEach((f,i)=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;const gg=c.createGain();gg.gain.setValueAtTime(0.035,t+i*0.55);gg.gain.exponentialRampToValueAtTime(0.001,t+i*0.55+0.5);o.connect(gg);gg.connect(g);o.start(t+i*0.55);o.stop(t+i*0.55+0.55);});t+=notes.length*0.55;if(state.running)setTimeout(loop,notes.length*550);}loop();}catch(e){}}
const SFX={abduct:()=>{scream();beep(280,0.18,'sine',0.05,-30)},hit:()=>noise(0.07,0.09),shoot:()=>beep(160,0.05,'square',0.04),upgrade:()=>beep(620,0.1,'sine',0.06)};

const upgrades={
  speed:{name:'Faster Ship',desc:'Move quicker',cost:35,level:0,max:5,apply:()=>state.shipSpeed+=0.7},
  beam:{name:'Faster Beam',desc:'Abduct faster',cost:45,level:0,max:5,apply:()=>state.beamPower+=0.3},
  range:{name:'Longer Beam',desc:'Reach farther',cost:40,level:0,max:4,apply:()=>state.beamRange+=1},
  width:{name:'Wider Beam',desc:'Bigger catch area',cost:50,level:0,max:4,apply:()=>state.beamWidth+=0.3},
  shield:{name:'Shield',desc:'Extra hit protection',cost:65,level:0,max:3,apply:()=>{state.maxShield++;state.shield=state.maxShield}},
  cloak:{name:'Cloak',desc:'Harder to hit',cost:75,level:0,max:3,apply:()=>state.cloakTime+=1.2},
  multi:{name:'Dual Beam',desc:'Two targets',cost:85,level:0,max:2,apply:()=>state.multiBeam++},
  magnet:{name:'Magnet',desc:'Pull nearby items',cost:55,level:0,max:3,apply:()=>state.magnet+=0.5},
  laser:{name:'Laser',desc:'Auto defense',cost:80,level:0,max:3,apply:()=>state.laser++},
  score:{name:'Score x',desc:'More points',cost:70,level:0,max:4,apply:()=>state.scoreMult+=0.2},
  night:{name:'Night Vision',desc:'See better at night',cost:50,level:0,max:2,apply:()=>state.nightVision+=0.3},
  cargo:{name:'Bigger Hold',desc:'Bonus credits',cost:60,level:0,max:3,apply:()=>state.cargoBonus+=0.15}
};
const state={running:false,score:0,credits:0,abducted:0,hp:100,wave:1,shipSpeed:4,beamPower:1,beamRange:5.5,beamWidth:1,shield:0,maxShield:0,cloakTime:0,multiBeam:0,magnet:0,laser:0,scoreMult:1,nightVision:0,cargoBonus:0,time:0.35,beamActive:false};
let ufo,beam,targets=[],cars=[],people=[],enemies=[],projectiles=[],streetLights=[],windows=[];
const keys={};
let joyX=0,joyY=0,joyActive=false;

const ground=new THREE.Mesh(new THREE.PlaneGeometry(90,70),new THREE.MeshStandardMaterial({color:0x4a7c3a,roughness:0.95}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

const streetMat=new THREE.MeshStandardMaterial({color:0x2d3748,roughness:0.9});
for(let z=-24;z<=24;z+=10){
  const r=new THREE.Mesh(new THREE.PlaneGeometry(80,2.2),streetMat);
  r.rotation.x=-Math.PI/2;r.position.set(0,0.02,z);scene.add(r);
  for(let x=-35;x<35;x+=4){
    const line=new THREE.Mesh(new THREE.PlaneGeometry(1.5,0.15),new THREE.MeshBasicMaterial({color:0xfbbf24}));
    line.rotation.x=-Math.PI/2;line.position.set(x,0.03,z);scene.add(line);
  }
}
for(let x=-30;x<=30;x+=12){
  const r=new THREE.Mesh(new THREE.PlaneGeometry(2.2,50),streetMat);
  r.rotation.x=-Math.PI/2;r.position.set(x,0.02,0);scene.add(r);
}

function makeBuilding(x,z){
  const w=2+Math.random()*3,h=3+Math.random()*12,d=2+Math.random()*3;
  const col=Math.random()>0.5?0x475569:0x334155;
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:col,roughness:0.8}));
  b.position.set(x,h/2,z);b.castShadow=true;b.receiveShadow=true;scene.add(b);
  const roof=new THREE.Mesh(new THREE.BoxGeometry(w+0.3,0.3,d+0.3),new THREE.MeshStandardMaterial({color:0x1e293b}));
  roof.position.set(x,h+0.15,z);scene.add(roof);
  const wins=[];
  for(let wy=1.2;wy<h-0.5;wy+=1.4){
    for(let side of [-1,1]){
      if(Math.random()>0.35){
        const win=new THREE.Mesh(new THREE.PlaneGeometry(0.35,0.5),new THREE.MeshBasicMaterial({color:0x1e293b}));
        win.position.set(x+side*(w/2+0.01),wy,z+(Math.random()-0.5)*d*0.6);
        win.rotation.y=side>0?0:Math.PI;
        scene.add(win);wins.push(win);
      }
    }
  }
  windows.push(...wins);
  return {mesh:b,wins,h};
}
const buildings=[];
for(let i=0;i<22;i++){
  const x=(Math.random()-0.5)*70,z=(Math.random()-0.5)*50;
  if(Math.abs(x)<4||Math.abs(z%10)<2)continue;
  buildings.push(makeBuilding(x,z));
}

for(let z=-20;z<=20;z+=10){
  for(let x=-32;x<=32;x+=8){
    if(Math.abs(x)<3)continue;
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.08,3.5,6),new THREE.MeshStandardMaterial({color:0x64748b}));
    pole.position.set(x,1.75,z+1.4);scene.add(pole);
    const lamp=new THREE.Mesh(new THREE.SphereGeometry(0.18,8,8),new THREE.MeshBasicMaterial({color:0x334155}));
    lamp.position.set(x,3.4,z+1.4);scene.add(lamp);
    const light=new THREE.PointLight(0xfbbf24,0,8);
    light.position.copy(lamp.position);scene.add(light);
    streetLights.push({lamp,light});
  }
}

function makeUFO(){
  const g=new THREE.Group();
  const base=new THREE.Mesh(new THREE.CylinderGeometry(1.6,2.1,0.45,20),new THREE.MeshStandardMaterial({color:0x94a3b8,metalness:0.7,roughness:0.25}));
  g.add(base);
  const dome=new THREE.Mesh(new THREE.SphereGeometry(0.85,16,12,0,Math.PI*2,0,Math.PI/2),new THREE.MeshStandardMaterial({color:0x22d3ee,emissive:0x22d3ee,emissiveIntensity:0.35,transparent:true,opacity:0.8}));
  dome.position.y=0.3;g.add(dome);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(1.55,0.07,8,28),new THREE.MeshBasicMaterial({color:0xa855f7}));
  ring.rotation.x=Math.PI/2;g.add(ring);
  const under=new THREE.PointLight(0x22d3ee,1.4,14);under.position.y=-0.4;g.add(under);
  g.position.set(0,14,0);g.castShadow=true;scene.add(g);
  return g;
}
ufo=makeUFO();

function makePerson(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.16,0.35,4,6),new THREE.MeshStandardMaterial({color:0xf472b6}));
  body.position.y=0.38;g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.13,8,8),new THREE.MeshStandardMaterial({color:0xfcd34d}));
  head.position.y=0.72;g.add(head);
  g.position.set((Math.random()-0.5)*60,0,(Math.random()-0.5)*40);
  g.userData={type:'human',progress:0,value:12,speed:0.4+Math.random()*0.3,dir:Math.random()*Math.PI*2};
  scene.add(g);people.push(g);targets.push(g);
}
function makeCar(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.45,0.7),new THREE.MeshStandardMaterial({color:Math.random()>0.5?0xef4444:0x3b82f6}));
  body.position.y=0.35;g.add(body);
  const cabin=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.3,0.6),new THREE.MeshStandardMaterial({color:0x1e293b}));
  cabin.position.y=0.6;g.add(cabin);
  g.position.set((Math.random()-0.5)*50,0,(Math.random()-0.5)*35);
  g.userData={type:'car',progress:0,value:22,speed:1.2+Math.random()*0.8,dir:Math.random()>0.5?0:Math.PI};
  scene.add(g);cars.push(g);targets.push(g);
}
function spawnWave(){
  for(let i=0;i<5+state.wave;i++)makePerson();
  for(let i=0;i<3+Math.floor(state.wave/2);i++)makeCar();
  if(state.wave%4===0){
    const h=new THREE.Group();
    const body=new THREE.Mesh(new THREE.BoxGeometry(1.3,0.4,0.55),new THREE.MeshStandardMaterial({color:0x1e40af}));
    h.add(body);
    const rotor=new THREE.Mesh(new THREE.BoxGeometry(2.4,0.04,0.12),new THREE.MeshStandardMaterial({color:0xcbd5e1}));
    rotor.position.y=0.35;h.add(rotor);
    h.position.set((Math.random()-0.5)*40,9,(Math.random()-0.5)*30);
    h.userData={rotor,cd:2};scene.add(h);enemies.push(h);
  }
}

function updateHUD(){
  document.getElementById('score').textContent=state.score;
  document.getElementById('credits').textContent=state.credits;
  document.getElementById('abducted').textContent=state.abducted;
  document.getElementById('hp').textContent=Math.max(0,Math.ceil(state.hp));
  document.getElementById('shopCredits').textContent=state.credits;
  const hour=Math.floor(state.time*24);
  const isDay=hour>=6&&hour<18;
  document.getElementById('time').textContent=(isDay?'DAY':'NIGHT')+' '+String(hour).padStart(2,'0')+':00';
}
function buildShop(){
  const g=document.getElementById('upgrid');g.innerHTML='';
  Object.keys(upgrades).forEach(k=>{
    const u=upgrades[k];const cost=Math.floor(u.cost*(1+u.level*0.55));
    const c=document.createElement('div');c.className='upcard';
    c.innerHTML=`<h4>${u.name} ${u.level}/${u.max}</h4><p>${u.desc}</p><button ${u.level>=u.max||state.credits<cost?'disabled':''}>${u.level>=u.max?'MAX':'BUY '+cost}</button>`;
    c.querySelector('button').onclick=()=>{if(state.credits>=cost&&u.level<u.max){state.credits-=cost;u.level++;u.apply();SFX.upgrade();buildShop();updateHUD();}};
    g.appendChild(c);
  });
}
function endGame(){state.running=false;document.getElementById('endText').textContent='Score: '+state.score+' · Abducted: '+state.abducted;document.getElementById('endScreen').style.display='flex';document.getElementById('hud').style.display='none';}
function startGame(){
  ensureAudio();startMusic();
  state.running=true;state.score=0;state.credits=40;state.abducted=0;state.hp=100;state.wave=1;state.time=0.4;
  targets.forEach(t=>scene.remove(t));targets=[];cars=[];people=[];
  enemies.forEach(e=>scene.remove(e));enemies=[];
  projectiles.forEach(p=>scene.remove(p.mesh));projectiles=[];
  spawnWave();
  document.getElementById('startScreen').style.display='none';
  document.getElementById('endScreen').style.display='none';
  document.getElementById('hud').style.display='block';
  document.getElementById('joy').style.display='block';
  updateHUD();
}
document.getElementById('startBtn').onclick=startGame;
document.getElementById('retryBtn').onclick=()=>{document.getElementById('endScreen').style.display='none';document.getElementById('startScreen').style.display='flex';};
document.getElementById('upgradeBtn').onclick=()=>{document.getElementById('shop').style.display='flex';buildShop();};
document.getElementById('closeShop').onclick=()=>document.getElementById('shop').style.display='none';

const joy=document.getElementById('joyBase'),stick=document.getElementById('joyStick');
let joyId=null;
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);joyActive=true;});
joy.addEventListener('pointermove',e=>{
  if(e.pointerId!==joyId)return;
  const r=joy.getBoundingClientRect();
  const cx=r.left+60,cy=r.top+60;
  let dx=e.clientX-cx,dy=e.clientY-cy;
  const d=Math.hypot(dx,dy);
  if(d>45){dx=dx/d*45;dy=dy/d*45;}
  stick.style.left=(35+dx)+'px';stick.style.top=(35+dy)+'px';
  joyX=dx/45;joyY=dy/45;
});
joy.addEventListener('pointerup',e=>{if(e.pointerId===joyId){joyId=null;joyActive=false;joyX=0;joyY=0;stick.style.left='35px';stick.style.top='35px';}});
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')e.preventDefault();});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
canvas.addEventListener('pointerdown',()=>state.beamActive=true);
canvas.addEventListener('pointerup',()=>state.beamActive=false);

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  if(!state.running){renderer.render(scene,camera);return;}

  state.time=(state.time+dt*0.015)%1;
  const hour=state.time*24;
  const isDay=hour>=6&&hour<18;
  const dayAmt=isDay?Math.sin((hour-6)/12*Math.PI):0;
  ambient.intensity=0.25+dayAmt*0.5;
  sun.intensity=dayAmt*1.2;
  moon.intensity=isDay?0.05:0.35;
  scene.background=new THREE.Color().setHSL(0.6,0.5,isDay?0.55+dayAmt*0.15:0.05);
  scene.fog=new THREE.Fog(scene.background.getHex(),50,110);
  streetLights.forEach(s=>{
    const on=!isDay;
    s.light.intensity=on?1.8:0;
    s.lamp.material.color.setHex(on?0xfbbf24:0x334155);
  });
  windows.forEach(w=>{
    if(!isDay&&Math.random()<0.002)w.material.color.setHex(Math.random()>0.3?0xfbbf24:0x1e293b);
    if(isDay)w.material.color.setHex(0x1e293b);
  });

  let mx=joyX,mz=joyY;
  if(keys['w']||keys['arrowup'])mz-=1;
  if(keys['s']||keys['arrowdown'])mz+=1;
  if(keys['a']||keys['arrowleft'])mx-=1;
  if(keys['d']||keys['arrowright'])mx+=1;
  if(mx||mz){
    const l=Math.hypot(mx,mz)||1;
    ufo.position.x=Math.max(-38,Math.min(38,ufo.position.x+mx/l*state.shipSpeed*dt*1.4));
    ufo.position.z=Math.max(-28,Math.min(28,ufo.position.z+mz/l*state.shipSpeed*dt*1.4));
  }
  ufo.rotation.y+=dt*0.5;
  ufo.position.y=14+Math.sin(clock.elapsedTime*1.4)*0.25;

  people.forEach(p=>{
    if(p.userData.progress>0)return;
    p.userData.dir+= (Math.random()-0.5)*dt*2;
    p.position.x+=Math.cos(p.userData.dir)*p.userData.speed*dt;
    p.position.z+=Math.sin(p.userData.dir)*p.userData.speed*dt;
    p.position.x=Math.max(-40,Math.min(40,p.position.x));
    p.position.z=Math.max(-30,Math.min(30,p.position.z));
  });
  cars.forEach(c=>{
    if(c.userData.progress>0)return;
    c.position.x+=Math.cos(c.userData.dir)*c.userData.speed*dt*2;
    c.position.z+=Math.sin(c.userData.dir)*c.userData.speed*dt*0.3;
    if(Math.abs(c.position.x)>42)c.userData.dir+=Math.PI;
  });

  const beaming=state.beamActive||keys[' '];
  document.getElementById('beamFill').style.width=beaming?'100%':'0%';
  if(beaming){
    if(!beam){
      beam=new THREE.Mesh(new THREE.CylinderGeometry(state.beamWidth*0.35,state.beamWidth*0.9,state.beamRange,14,1,true),new THREE.MeshBasicMaterial({color:0x22d3ee,transparent:true,opacity:0.32,side:THREE.DoubleSide}));
      beam.position.y=-state.beamRange/2-0.2;ufo.add(beam);
    }
    targets.forEach(t=>{
      const dx=t.position.x-ufo.position.x,dz=t.position.z-ufo.position.z,dist=Math.hypot(dx,dz);
      if(dist<state.beamWidth+0.6&&t.position.y<12){
        t.userData.progress+=state.beamPower*dt*1.6;
        t.position.y+=state.beamPower*dt*2;
        if(t.userData.progress>1||t.position.y>11){
          const bonus=1+state.cargoBonus;
          state.score+=Math.floor(t.userData.value*state.scoreMult*bonus);
          state.credits+=Math.floor(t.userData.value*0.55*bonus);
          state.abducted++;SFX.abduct();
          scene.remove(t);
          targets.splice(targets.indexOf(t),1);
          if(t.userData.type==='human')people.splice(people.indexOf(t),1);
          else cars.splice(cars.indexOf(t),1);
        }
      }
    });
  }else if(beam){ufo.remove(beam);beam=null;}

  enemies.forEach(e=>{
    e.userData.rotor.rotation.y+=dt*14;
    e.position.x+=Math.sin(clock.elapsedTime+e.position.z)*dt*1.8;
    e.lookAt(ufo.position);
    e.userData.cd-=dt;
    if(e.userData.cd<=0){
      e.userData.cd=2.4;
      const p=new THREE.Mesh(new THREE.SphereGeometry(0.1,6,6),new THREE.MeshBasicMaterial({color:0xfbbf24}));
      p.position.copy(e.position);scene.add(p);
      projectiles.push({mesh:p,vel:new THREE.Vector3().subVectors(ufo.position,e.position).normalize().multiplyScalar(7)});
      SFX.shoot();
    }
  });
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];p.mesh.position.addScaledVector(p.vel,dt);
    if(p.mesh.position.distanceTo(ufo.position)<1.1){
      state.hp-=10;SFX.hit();scene.remove(p.mesh);projectiles.splice(i,1);
      if(state.hp<=0)endGame();updateHUD();
    }else if(p.mesh.position.y<0||p.mesh.position.distanceTo(ufo.position)>40){scene.remove(p.mesh);projectiles.splice(i,1);}
  }

  if(targets.length===0){state.wave++;state.credits+=15+state.wave*4;spawnWave();updateHUD();}
  renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
