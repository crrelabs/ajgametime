<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Alien Abduction — AJ GameTime</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Nunito:wght@600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:Nunito,sans-serif;color:#e2e8f0;touch-action:none}
#c{display:block;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none;z-index:10}
#top{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap}
.stat{background:rgba(15,23,42,.88);padding:6px 10px;border-radius:8px;font-family:Orbitron,sans-serif;font-size:.75rem;border:1px solid #22d3ee;color:#67e8f9}
.stat span{color:#fff}
#beamBar{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);width:140px;height:7px;background:#1e293b;border-radius:4px;border:1px solid #22d3ee;overflow:hidden}
#beamFill{height:100%;width:0%;background:linear-gradient(90deg,#22d3ee,#a855f7)}
#hint{position:absolute;bottom:12px;left:12px;font-size:.65rem;color:#94a3b8;background:rgba(15,23,42,.75);padding:4px 8px;border-radius:6px}
#upgradeBtn{position:absolute;top:12px;right:12px;pointer-events:auto;padding:8px 12px;font-family:Orbitron,sans-serif;background:linear-gradient(135deg,#7c3aed,#22d3ee);border:none;border-radius:10px;color:#fff;cursor:pointer;font-size:.75rem}
#joy{position:absolute;bottom:20px;left:20px;width:110px;height:110px;pointer-events:auto;z-index:20;display:none}
#joyBase{width:110px;height:110px;border-radius:50%;background:rgba(15,23,42,.65);border:2px solid #22d3ee;position:relative}
#joyStick{width:44px;height:44px;border-radius:50%;background:#22d3ee;position:absolute;left:33px;top:33px;box-shadow:0 0 12px #22d3ee}
.overlay{position:absolute;inset:0;background:rgba(2,6,23,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;text-align:center;padding:16px}
.overlay h1{font-family:Orbitron,sans-serif;font-size:clamp(1.6rem,6vw,2.8rem);background:linear-gradient(135deg,#22d3ee,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.3rem}
.overlay p{max-width:480px;margin:.3rem 0 .8rem;line-height:1.4;color:#94a3b8;font-size:.85rem}
.btn{display:inline-block;padding:11px 22px;margin:5px;font-family:Orbitron,sans-serif;font-size:.9rem;color:#fff;background:linear-gradient(135deg,#7c3aed,#22d3ee);border:none;border-radius:10px;cursor:pointer}
#shop{position:absolute;inset:0;background:rgba(2,6,23,.95);z-index:40;display:none;flex-direction:column;align-items:center;padding:12px;overflow-y:auto}
#shop h2{font-family:Orbitron,sans-serif;margin-bottom:8px;color:#22d3ee;font-size:1.2rem}
.upgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;max-width:820px;width:100%}
.upcard{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:8px}
.upcard h4{font-family:Orbitron,sans-serif;font-size:.7rem;color:#67e8f9;margin-bottom:2px}
.upcard p{font-size:.65rem;color:#94a3b8;margin-bottom:5px}
.upcard button{width:100%;padding:5px;font-family:Orbitron,sans-serif;background:#22d3ee;color:#020617;border:none;border-radius:5px;cursor:pointer;font-size:.7rem;font-weight:700}
.upcard button:disabled{background:#334155;color:#64748b}
#time{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-family:Orbitron,sans-serif;font-size:.75rem;background:rgba(15,23,42,.85);padding:5px 10px;border-radius:6px;border:1px solid #22d3ee}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" style="display:none">
  <div id="top">
    <div class="stat">SCORE <span id="score">0</span></div>
    <div class="stat">CREDITS <span id="credits">0</span></div>
    <div class="stat">ABDUCTED <span id="abducted">0</span></div>
    <div class="stat">HP <span id="hp">100</span></div>
  </div>
  <div id="time">DAY 12:00</div>
  <button id="upgradeBtn">UPGRADES</button>
  <div id="beamBar"><div id="beamFill"></div></div>
  <div id="hint">Joystick / WASD · Hold to beam · Camera follows</div>
  <div id="joy"><div id="joyBase"><div id="joyStick"></div></div></div>
</div>
<div class="overlay" id="startScreen">
  <h1>ALIEN ABDUCTION</h1>
  <p>Better people, ragdoll abductions, camera follow, more buildings, fixed sound & performance.</p>
  <button class="btn" id="startBtn">START</button>
</div>
<div class="overlay" id="endScreen" style="display:none">
  <h1>SHIP DESTROYED</h1>
  <p id="endText">Score: 0</p>
  <button class="btn" id="retryBtn">RETRY</button>
</div>
<div id="shop">
  <h2>UPGRADES</h2>
  <p style="margin-bottom:6px">Credits: <span id="shopCredits">0</span></p>
  <div class="upgrid" id="upgrid"></div>
  <button class="btn" id="closeShop">RESUME</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,160);
const clock=new THREE.Clock();

const ambient=new THREE.AmbientLight(0xffffff,0.5);
scene.add(ambient);
const sun=new THREE.DirectionalLight(0xfff5e0,1);
sun.position.set(25,35,12);scene.add(sun);

let audioCtx;
function ensureAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function beep(f,d,t,v,s){try{const c=ensureAudio();const o=c.createOscillator();const g=c.createGain();o.type=t||'sine';o.frequency.setValueAtTime(f,c.currentTime);if(s)o.frequency.linearRampToValueAtTime(f+s,c.currentTime+d);g.gain.setValueAtTime(v||0.08,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d);}catch(e){}}
function scream(){try{const c=ensureAudio();const o=c.createOscillator();const g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(140+Math.random()*50,c.currentTime);o.frequency.linearRampToValueAtTime(360+Math.random()*80,c.currentTime+0.1);o.frequency.linearRampToValueAtTime(60,c.currentTime+0.35);g.gain.setValueAtTime(0.11,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.4);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+0.4);}catch(e){}}
function noise(d,v){try{const c=ensureAudio();const n=c.createBufferSource();const b=c.createBuffer(1,c.sampleRate*d,c.sampleRate);const dat=b.getChannelData(0);for(let i=0;i<dat.length;i++)dat[i]=(Math.random()*2-1)*(1-i/dat.length);n.buffer=b;const g=c.createGain();g.gain.value=v||0.08;n.connect(g);g.connect(c.destination);n.start();}catch(e){}}
let musicOn=false;
function startMusic(){if(musicOn)return;musicOn=true;try{const c=ensureAudio();const g=c.createGain();g.gain.value=0.032;g.connect(c.destination);const notes=[55,65,73,82];let t=c.currentTime;function loop(){notes.forEach((f,i)=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;const gg=c.createGain();gg.gain.setValueAtTime(0.04,t+i*0.5);gg.gain.exponentialRampToValueAtTime(0.001,t+i*0.5+0.45);o.connect(gg);gg.connect(g);o.start(t+i*0.5);o.stop(t+i*0.5+0.5);});t+=notes.length*0.5;if(state.running)setTimeout(loop,notes.length*500);}loop();}catch(e){}}
const SFX={abduct:()=>{scream();beep(260,0.16,'sine',0.06,-25)},hit:()=>noise(0.06,0.1),shoot:()=>beep(150,0.04,'square',0.05),upgrade:()=>beep(600,0.09,'sine',0.07),beam:()=>beep(220,0.05,'sine',0.03)};

const upgrades={
  speed:{name:'Faster Ship',desc:'Move quicker',cost:30,level:0,max:5,apply:()=>state.shipSpeed+=0.6},
  beam:{name:'Faster Beam',desc:'Abduct faster',cost:40,level:0,max:5,apply:()=>state.beamPower+=0.4},
  range:{name:'Longer Beam',desc:'Reach farther',cost:35,level:0,max:4,apply:()=>state.beamRange+=1.2},
  width:{name:'Wider Beam',desc:'Bigger area',cost:45,level:0,max:4,apply:()=>state.beamWidth+=0.45},
  shield:{name:'Shield',desc:'Extra protection',cost:60,level:0,max:3,apply:()=>{state.maxShield++;state.shield=state.maxShield}},
  score:{name:'Score x',desc:'More points',cost:65,level:0,max:4,apply:()=>state.scoreMult+=0.18},
  cargo:{name:'Bigger Hold',desc:'Bonus credits',cost:55,level:0,max:3,apply:()=>state.cargoBonus+=0.12}
};
const state={running:false,score:0,credits:0,abducted:0,hp:100,wave:1,shipSpeed:3.8,beamPower:1.4,beamRange:7,beamWidth:1.8,shield:0,maxShield:0,scoreMult:1,cargoBonus:0,time:0.4,beamActive:false};
let ufo,beam,targets=[],cars=[],people=[],enemies=[],projectiles=[],streetLights=[],windows=[];
const keys={};
let joyX=0,joyY=0;

const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,80),new THREE.MeshStandardMaterial({color:0x4a7c3a}));
ground.rotation.x=-Math.PI/2;scene.add(ground);

const streetMat=new THREE.MeshStandardMaterial({color:0x2d3748});
for(let z=-28;z<=28;z+=9){
  const r=new THREE.Mesh(new THREE.PlaneGeometry(90,2),streetMat);
  r.rotation.x=-Math.PI/2;r.position.set(0,0.02,z);scene.add(r);
}
for(let x=-36;x<=36;x+=12){
  const r=new THREE.Mesh(new THREE.PlaneGeometry(2,60),streetMat);
  r.rotation.x=-Math.PI/2;r.position.set(x,0.02,0);scene.add(r);
}

function makeBuilding(x,z){
  const w=1.8+Math.random()*2.8,h=2.5+Math.random()*10,d=1.8+Math.random()*2.8;
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:Math.random()>0.5?0x475569:0x334155}));
  b.position.set(x,h/2,z);scene.add(b);
  const roof=new THREE.Mesh(new THREE.BoxGeometry(w+0.2,0.25,d+0.2),new THREE.MeshStandardMaterial({color:0x1e293b}));
  roof.position.set(x,h+0.12,z);scene.add(roof);
  const wins=[];
  for(let wy=1;wy<h-0.4;wy+=1.5){
    if(Math.random()>0.4){
      const win=new THREE.Mesh(new THREE.PlaneGeometry(0.3,0.4),new THREE.MeshBasicMaterial({color:0x1e293b}));
      win.position.set(x+(Math.random()>0.5?w/2+0.01:-w/2-0.01),wy,z+(Math.random()-0.5)*d*0.5);
      scene.add(win);wins.push(win);
    }
  }
  windows.push(...wins);
}
for(let i=0;i<38;i++){
  const x=(Math.random()-0.5)*80,z=(Math.random()-0.5)*55;
  if(Math.abs(x)<5||Math.abs(z%9)<1.5)continue;
  makeBuilding(x,z);
}

for(let z=-22;z<=22;z+=9){
  for(let x=-34;x<=34;x+=9){
    if(Math.abs(x)<4)continue;
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.07,3.2,5),new THREE.MeshStandardMaterial({color:0x64748b}));
    pole.position.set(x,1.6,z+1.2);scene.add(pole);
    const lamp=new THREE.Mesh(new THREE.SphereGeometry(0.15,6,6),new THREE.MeshBasicMaterial({color:0x334155}));
    lamp.position.set(x,3.1,z+1.2);scene.add(lamp);
    const light=new THREE.PointLight(0xfbbf24,0,6);
    light.position.copy(lamp.position);scene.add(light);
    streetLights.push({lamp,light});
  }
}

function makeUFO(){
  const g=new THREE.Group();
  const base=new THREE.Mesh(new THREE.CylinderGeometry(1.5,2,0.4,14),new THREE.MeshStandardMaterial({color:0x94a3b8,metalness:0.6,roughness:0.3}));
  g.add(base);
  const dome=new THREE.Mesh(new THREE.SphereGeometry(0.75,10,8,0,Math.PI*2,0,Math.PI/2),new THREE.MeshStandardMaterial({color:0x22d3ee,emissive:0x22d3ee,emissiveIntensity:0.3,transparent:true,opacity:0.75}));
  dome.position.y=0.25;g.add(dome);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(1.45,0.06,6,16),new THREE.MeshBasicMaterial({color:0xa855f7}));
  ring.rotation.x=Math.PI/2;g.add(ring);
  const under=new THREE.PointLight(0x22d3ee,1.2,12);under.position.y=-0.3;g.add(under);
  g.position.set(0,13,0);scene.add(g);
  return g;
}
ufo=makeUFO();

function makePerson(){
  const g=new THREE.Group();
  const skin=0xfcd34d, shirt=Math.random()>0.5?0xf472b6:0x60a5fa, pants=0x334155;
  const torso=new THREE.Mesh(new THREE.BoxGeometry(0.28,0.4,0.16),new THREE.MeshStandardMaterial({color:shirt}));
  torso.position.y=0.55;g.add(torso);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.12,8,6),new THREE.MeshStandardMaterial({color:skin}));
  head.position.y=0.85;g.add(head);
  const armL=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.32,0.08),new THREE.MeshStandardMaterial({color:skin}));
  armL.position.set(-0.2,0.5,0);g.add(armL);
  const armR=armL.clone();armR.position.x=0.2;g.add(armR);
  const legL=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.35,0.09),new THREE.MeshStandardMaterial({color:pants}));
  legL.position.set(-0.08,0.18,0);g.add(legL);
  const legR=legL.clone();legR.position.x=0.08;g.add(legR);
  g.position.set((Math.random()-0.5)*65,0,(Math.random()-0.5)*45);
  g.userData={type:'human',progress:0,value:10,speed:0.35+Math.random()*0.25,dir:Math.random()*Math.PI*2,ragdoll:false,parts:[armL,armR,legL,legR,head]};
  scene.add(g);people.push(g);targets.push(g);
}
function makeCar(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(1.3,0.4,0.65),new THREE.MeshStandardMaterial({color:Math.random()>0.5?0xef4444:0x3b82f6}));
  body.position.y=0.3;g.add(body);
  const cabin=new THREE.Mesh(new THREE.BoxGeometry(0.65,0.28,0.55),new THREE.MeshStandardMaterial({color:0x1e293b}));
  cabin.position.y=0.55;g.add(cabin);
  g.position.set((Math.random()-0.5)*55,0,(Math.random()-0.5)*38);
  g.userData={type:'car',progress:0,value:18,speed:1+Math.random()*0.6,dir:Math.random()>0.5?0:Math.PI};
  scene.add(g);cars.push(g);targets.push(g);
}
function spawnWave(){
  for(let i=0;i<4+state.wave;i++)makePerson();
  for(let i=0;i<2+Math.floor(state.wave/2);i++)makeCar();
  if(state.wave%5===0){
    const h=new THREE.Group();
    const body=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.35,0.5),new THREE.MeshStandardMaterial({color:0x1e40af}));
    h.add(body);
    const rotor=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.03,0.1),new THREE.MeshStandardMaterial({color:0xcbd5e1}));
    rotor.position.y=0.3;h.add(rotor);
    h.position.set((Math.random()-0.5)*35,8.5,(Math.random()-0.5)*25);
    h.userData={rotor,cd:2.5};scene.add(h);enemies.push(h);
  }
}

function updateHUD(){
  document.getElementById('score').textContent=state.score;
  document.getElementById('credits').textContent=state.credits;
  document.getElementById('abducted').textContent=state.abducted;
  document.getElementById('hp').textContent=Math.max(0,Math.ceil(state.hp));
  document.getElementById('shopCredits').textContent=state.credits;
  const hour=Math.floor(state.time*24);
  const isDay=hour>=6&&hour<18;
  document.getElementById('time').textContent=(isDay?'DAY':'NIGHT')+' '+String(hour).padStart(2,'0')+':00';
}
function buildShop(){
  const g=document.getElementById('upgrid');g.innerHTML='';
  Object.keys(upgrades).forEach(k=>{
    const u=upgrades[k];const cost=Math.floor(u.cost*(1+u.level*0.5));
    const c=document.createElement('div');c.className='upcard';
    c.innerHTML=`<h4>${u.name} ${u.level}/${u.max}</h4><p>${u.desc}</p><button ${u.level>=u.max||state.credits<cost?'disabled':''}>${u.level>=u.max?'MAX':'BUY '+cost}</button>`;
    c.querySelector('button').onclick=()=>{if(state.credits>=cost&&u.level<u.max){state.credits-=cost;u.level++;u.apply();SFX.upgrade();buildShop();updateHUD();}};
    g.appendChild(c);
  });
}
function endGame(){state.running=false;document.getElementById('endText').textContent='Score: '+state.score+' · Abducted: '+state.abducted;document.getElementById('endScreen').style.display='flex';document.getElementById('hud').style.display='none';}
function startGame(){
  ensureAudio();startMusic();
  state.running=true;state.score=0;state.credits=50;state.abducted=0;state.hp=100;state.wave=1;state.time=0.42;
  targets.forEach(t=>scene.remove(t));targets=[];cars=[];people=[];
  enemies.forEach(e=>scene.remove(e));enemies=[];
  projectiles.forEach(p=>scene.remove(p.mesh));projectiles=[];
  spawnWave();
  document.getElementById('startScreen').style.display='none';
  document.getElementById('endScreen').style.display='none';
  document.getElementById('hud').style.display='block';
  document.getElementById('joy').style.display='block';
  updateHUD();
}
document.getElementById('startBtn').onclick=startGame;
document.getElementById('retryBtn').onclick=()=>{document.getElementById('endScreen').style.display='none';document.getElementById('startScreen').style.display='flex';};
document.getElementById('upgradeBtn').onclick=()=>{document.getElementById('shop').style.display='flex';buildShop();};
document.getElementById('closeShop').onclick=()=>document.getElementById('shop').style.display='none';

const joy=document.getElementById('joyBase'),stick=document.getElementById('joyStick');
let joyId=null;
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);});
joy.addEventListener('pointermove',e=>{
  if(e.pointerId!==joyId)return;
  const r=joy.getBoundingClientRect();
  const cx=r.left+55,cy=r.top+55;
  let dx=e.clientX-cx,dy=e.clientY-cy;
  const d=Math.hypot(dx,dy);
  if(d>40){dx=dx/d*40;dy=dy/d*40;}
  stick.style.left=(33+dx)+'px';stick.style.top=(33+dy)+'px';
  joyX=dx/40;joyY=dy/40;
});
joy.addEventListener('pointerup',e=>{if(e.pointerId===joyId){joyId=null;joyX=0;joyY=0;stick.style.left='33px';stick.style.top='33px';}});
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();state.beamActive=true;}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.code==='Space')state.beamActive=false;});
canvas.addEventListener('pointerdown',()=>state.beamActive=true);
canvas.addEventListener('pointerup',()=>state.beamActive=false);

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.04);
  if(!state.running){renderer.render(scene,camera);return;}

  state.time=(state.time+dt*0.012)%1;
  const hour=state.time*24;
  const isDay=hour>=6&&hour<18;
  const dayAmt=isDay?Math.sin((hour-6)/12*Math.PI):0;
  ambient.intensity=0.22+dayAmt*0.45;
  sun.intensity=dayAmt*1.1;
  scene.background=new THREE.Color().setHSL(0.58,0.45,isDay?0.5+dayAmt*0.18:0.04);
  streetLights.forEach(s=>{
    const on=!isDay;
    s.light.intensity=on?1.6:0;
    s.lamp.material.color.setHex(on?0xfbbf24:0x334155);
  });
  windows.forEach(w=>{
    if(!isDay&&Math.random()<0.0015)w.material.color.setHex(Math.random()>0.25?0xfbbf24:0x1e293b);
    if(isDay)w.material.color.setHex(0x1e293b);
  });

  let mx=joyX,mz=joyY;
  if(keys['w']||keys['arrowup'])mz-=1;
  if(keys['s']||keys['arrowdown'])mz+=1;
  if(keys['a']||keys['arrowleft'])mx-=1;
  if(keys['d']||keys['arrowright'])mx+=1;
  if(mx||mz){
    const l=Math.hypot(mx,mz)||1;
    ufo.position.x=Math.max(-40,Math.min(40,ufo.position.x+mx/l*state.shipSpeed*dt*1.3));
    ufo.position.z=Math.max(-30,Math.min(30,ufo.position.z+mz/l*state.shipSpeed*dt*1.3));
  }
  ufo.rotation.y+=dt*0.45;
  ufo.position.y=13+Math.sin(clock.elapsedTime*1.3)*0.2;

  camera.position.x=THREE.MathUtils.lerp(camera.position.x,ufo.position.x,0.08);
  camera.position.z=THREE.MathUtils.lerp(camera.position.z,ufo.position.z+16,0.08);
  camera.position.y=THREE.MathUtils.lerp(camera.position.y,ufo.position.y+14,0.06);
  camera.lookAt(ufo.position.x,0,ufo.position.z);

  people.forEach(p=>{
    if(p.userData.ragdoll||p.userData.progress>0){
      if(p.userData.parts){
        p.userData.parts.forEach((part,i)=>{
          part.rotation.x+=dt*(2+i)*0.8;
          part.rotation.z+=dt*(1.5-i*0.3);
        });
      }
      return;
    }
    p.userData.dir+=(Math.random()-0.5)*dt*1.5;
    p.position.x+=Math.cos(p.userData.dir)*p.userData.speed*dt;
    p.position.z+=Math.sin(p.userData.dir)*p.userData.speed*dt;
    p.position.x=Math.max(-42,Math.min(42,p.position.x));
    p.position.z=Math.max(-32,Math.min(32,p.position.z));
  });
  cars.forEach(c=>{
    if(c.userData.progress>0)return;
    c.position.x+=Math.cos(c.userData.dir)*c.userData.speed*dt*1.8;
    if(Math.abs(c.position.x)>45)c.userData.dir+=Math.PI;
  });

  const beaming=state.beamActive||keys[' '];
  document.getElementById('beamFill').style.width=beaming?'100%':'0%';
  if(beaming){
    if(!beam){
      beam=new THREE.Mesh(new THREE.CylinderGeometry(state.beamWidth*0.3,state.beamWidth*0.8,state.beamRange,10,1,true),new THREE.MeshBasicMaterial({color:0x22d3ee,transparent:true,opacity:0.3,side:THREE.DoubleSide}));
      beam.position.y=-state.beamRange/2-0.15;ufo.add(beam);
      SFX.beam();
    }
    targets.forEach(t=>{
      const dx=t.position.x-ufo.position.x,dz=t.position.z-ufo.position.z,dist=Math.hypot(dx,dz);
      if(dist<state.beamWidth+1.2&&t.position.y<12){
        t.userData.progress+=state.beamPower*dt*2.2;
        t.position.y+=state.beamPower*dt*2.8;
        t.position.x+=(ufo.position.x-t.position.x)*dt*1.5;
        t.position.z+=(ufo.position.z-t.position.z)*dt*1.5;
        if(t.userData.type==='human')t.userData.ragdoll=true;
        if(t.userData.progress>0.8||t.position.y>11){
          const bonus=1+state.cargoBonus;
          state.score+=Math.floor(t.userData.value*state.scoreMult*bonus);
          state.credits+=Math.floor(t.userData.value*0.5*bonus);
          state.abducted++;SFX.abduct();
          scene.remove(t);
          targets.splice(targets.indexOf(t),1);
          if(t.userData.type==='human')people.splice(people.indexOf(t),1);
          else cars.splice(cars.indexOf(t),1);
        }
      }
    });
  }else if(beam){ufo.remove(beam);beam=null;}

  enemies.forEach(e=>{
    e.userData.rotor.rotation.y+=dt*12;
    e.position.x+=Math.sin(clock.elapsedTime+e.position.z)*dt*1.5;
    e.lookAt(ufo.position);
    e.userData.cd-=dt;
    if(e.userData.cd<=0){
      e.userData.cd=2.6;
      const p=new THREE.Mesh(new THREE.SphereGeometry(0.09,5,5),new THREE.MeshBasicMaterial({color:0xfbbf24}));
      p.position.copy(e.position);scene.add(p);
      projectiles.push({mesh:p,vel:new THREE.Vector3().subVectors(ufo.position,e.position).normalize().multiplyScalar(6.5)});
      SFX.shoot();
    }
  });
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];p.mesh.position.addScaledVector(p.vel,dt);
    if(p.mesh.position.distanceTo(ufo.position)<1){
      state.hp-=8;SFX.hit();scene.remove(p.mesh);projectiles.splice(i,1);
      if(state.hp<=0)endGame();updateHUD();
    }else if(p.mesh.position.y<0||p.mesh.position.distanceTo(ufo.position)>35){scene.remove(p.mesh);projectiles.splice(i,1);}
  }

  if(targets.length===0){state.wave++;state.credits+=12+state.wave*3;spawnWave();updateHUD();}
  renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
