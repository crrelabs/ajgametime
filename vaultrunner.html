<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Vault Runner — AJ GameTime</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#4a9fe0;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
#c{display:block;width:100vw;height:100vh}
#hud{position:fixed;top:0;left:0;right:0;padding:12px 16px;display:flex;justify-content:space-between;pointer-events:none;z-index:5;font-weight:700;text-shadow:0 1px 4px #000}
#msg{position:fixed;top:34%;left:50%;transform:translate(-50%,-50%);font-size:2rem;font-weight:900;color:#fff;text-shadow:0 0 18px #0ff;opacity:0;pointer-events:none;z-index:6;transition:opacity .15s}
#msg.show{opacity:1}
#overlay,#shop{position:fixed;inset:0;background:rgba(5,15,30,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;text-align:center;padding:16px}
#shop{display:none}
h1{font-size:2.6rem;color:#0ff;text-shadow:0 0 28px #0ff;margin-bottom:6px}
p{max-width:480px;margin:6px 0 14px;opacity:.9;line-height:1.4}
button{background:#0ff;color:#000;border:none;padding:11px 24px;font-size:0.95rem;font-weight:800;border-radius:8px;cursor:pointer;margin:4px;box-shadow:0 0 14px #0ff}
button:active{transform:scale(.96)}
.swatch{width:34px;height:34px;border-radius:50%;display:inline-block;margin:3px;border:3px solid transparent;cursor:pointer}
.swatch.sel{border-color:#fff;transform:scale(1.15)}
#joy{position:fixed;bottom:22px;left:20px;width:120px;height:120px;border-radius:50%;background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.35);z-index:8;touch-action:none}
#knob{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.75);left:34px;top:34px;pointer-events:none}
#jumpBtn{position:fixed;bottom:28px;right:24px;width:96px;height:96px;border-radius:50%;background:rgba(0,255,180,.38);border:3px solid #0ff;color:#fff;font-size:1.3rem;font-weight:900;z-index:8;display:flex;align-items:center;justify-content:center}
#jumpBtn:active{background:rgba(0,255,180,.65)}
#grappleBtn{position:fixed;bottom:130px;right:36px;width:64px;height:64px;border-radius:50%;background:rgba(255,80,120,.4);border:2px solid #ff5080;color:#fff;font-size:0.85rem;font-weight:800;z-index:8;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="spd">0</span><span id="coins">0</span><span id="time">0.0s</span></div>
<div id="msg"></div>
<div id="overlay">
  <h1>VAULT RUNNER</h1>
  <p>Parkour across rooftops. Wall-run, grapple, and reach the finish.<br>
  <b>WASD</b> move · <b>Space</b> jump · <b>Shift</b> slide · <b>E</b> grapple<br>
  Touch: joystick + JUMP + GRAPPLE</p>
  <div style="margin:8px 0">
    <button id="lvl1">LEVEL 1</button>
    <button id="lvl2">LEVEL 2</button>
    <button id="lvl3">LEVEL 3</button>
  </div>
  <button id="startNormal">NORMAL RUN</button>
  <button id="startGhost" style="background:#fff">TIME ATTACK GHOST</button>
  <button id="openShop" style="background:#ffaa00;color:#000">SHOP / CUSTOMIZE</button>
</div>
<div id="shop">
  <h1>SHOP</h1>
  <p id="coinText">Coins: 0</p>
  <div id="colors"></div>
  <div style="margin:10px 0">
    <button data-outfit="runner">Runner</button>
    <button data-outfit="hoodie">Hoodie</button>
    <button data-outfit="armor">Armor</button>
  </div>
  <div style="margin:10px 0">
    <button id="buyTrail">Trail (50)</button>
    <button id="buyShoes">Speed Shoes (80)</button>
    <button id="toggleNight">Night Mode</button>
  </div>
  <button id="closeShop">BACK</button>
</div>
<div id="joy"><div id="knob"></div></div>
<button id="jumpBtn">JUMP</button>
<button id="grappleBtn">HOOK</button>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.BasicShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,0.1,500);
camera.position.set(0,5,-10);

scene.add(new THREE.AmbientLight(0x88aacc,0.65));
scene.add(new THREE.HemisphereLight(0x87ceeb,0x334455,0.4));
const sun=new THREE.DirectionalLight(0xffeedd,1.1);
sun.position.set(40,60,20);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.near=5;sun.shadow.camera.far=150;
sun.shadow.camera.left=-50;sun.shadow.camera.right=50;
sun.shadow.camera.top=50;sun.shadow.camera.bottom=-50;
scene.add(sun);

const lava=new THREE.Mesh(new THREE.PlaneGeometry(900,900),
  new THREE.MeshStandardMaterial({color:0xff3300,emissive:0xff2200,emissiveIntensity:0.85,roughness:0.4}));
lava.rotation.x=-Math.PI/2;lava.position.y=-20;scene.add(lava);
for(let i=0;i<5;i++){
  const l=new THREE.PointLight(0xff4400,1,35);
  l.position.set((i-2)*35,-14,i*45);scene.add(l);
}

const rainGeo=new THREE.BufferGeometry();
const rainCount=400;
const rainPos=new Float32Array(rainCount*3);
for(let i=0;i<rainCount;i++){
  rainPos[i*3]=(Math.random()-0.5)*80;
  rainPos[i*3+1]=Math.random()*30;
  rainPos[i*3+2]=(Math.random()-0.5)*80;
}
rainGeo.setAttribute('position',new THREE.BufferAttribute(rainPos,3));
const rain=new THREE.Points(rainGeo,new THREE.PointsMaterial({color:0xaaccff,size:0.08,transparent:true,opacity:0.4}));
rain.visible=false;scene.add(rain);

const COLORS=[0x00ccff,0xff3366,0x00ff88,0xffaa00,0xaa44ff,0xffffff];
const state={color:0x00ccff,outfit:'runner',coins:0,trail:false,shoes:false,night:false,mode:'normal'};
const SAVE='vaultrunner_v2';
try{const s=JSON.parse(localStorage.getItem(SAVE));if(s)Object.assign(state,s);}catch(e){}
function save(){localStorage.setItem(SAVE,JSON.stringify(state));}

const player=new THREE.Group();
function rebuildPlayer(){
  while(player.children.length)player.remove(player.children[0]);
  const mat=new THREE.MeshStandardMaterial({color:state.color,emissive:state.color,emissiveIntensity:0.15,roughness:0.45,metalness:0.25});
  const skin=new THREE.MeshStandardMaterial({color:0xffcc99,roughness:0.6});
  const torso=new THREE.Mesh(new THREE.BoxGeometry(0.55,0.7,0.32),mat);
  torso.position.y=1.05;torso.castShadow=true;player.add(torso);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.28,16,12),skin);
  head.position.y=1.62;head.castShadow=true;player.add(head);
  const eyes=new THREE.Mesh(new THREE.BoxGeometry(0.32,0.08,0.1),new THREE.MeshStandardMaterial({color:0x111122,emissive:0x00ffff,emissiveIntensity:0.6}));
  eyes.position.set(0,1.62,0.22);player.add(eyes);
  for(let s=-1;s<=1;s+=2){
    const arm=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,0.55,8),mat);
    arm.position.set(s*0.38,1.0,0);arm.rotation.z=s*0.15;arm.castShadow=true;player.add(arm);
    const leg=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.09,0.7,8),new THREE.MeshStandardMaterial({color:0x222233,roughness:0.7}));
    leg.position.set(s*0.15,0.35,0);leg.castShadow=true;player.add(leg);
  }
  if(state.outfit==='hoodie'){
    const hood=new THREE.Mesh(new THREE.SphereGeometry(0.32,12,10),mat);
    hood.position.y=1.68;hood.scale.set(1,0.9,1.05);player.add(hood);
  }else if(state.outfit==='armor'){
    const plate=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.35,0.4),new THREE.MeshStandardMaterial({color:0x888899,metalness:0.7,roughness:0.3}));
    plate.position.y=1.15;player.add(plate);
  }
  if(state.shoes){
    const shoe=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.1,0.35),new THREE.MeshStandardMaterial({color:0xffdd00,emissive:0xffaa00,emissiveIntensity:0.3}));
    shoe.position.set(0,0.05,0.05);player.add(shoe);
  }
}
rebuildPlayer();
scene.add(player);

const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
function beep(freq,dur,type,vol){
  if(audioCtx.state==='suspended')audioCtx.resume();
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.type=type||'sine';
  o.frequency.value=freq;
  g.gain.setValueAtTime(vol||0.15,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(audioCtx.destination);
  o.start();o.stop(audioCtx.currentTime+dur);
}
function playJump(){beep(520,0.12,'square',0.1);beep(780,0.08,'sine',0.08);}
function playGrapple(){beep(180,0.25,'sawtooth',0.12);beep(420,0.15,'square',0.08);}
function playCoin(){beep(880,0.08,'sine',0.1);beep(1320,0.1,'sine',0.08);}
function playFinish(){beep(523,0.15,'sine',0.12);beep(659,0.15,'sine',0.12);beep(784,0.3,'sine',0.14);}
function playWall(){beep(340,0.1,'square',0.08);}
let musicGain,musicOsc;
function startMusic(){
  if(audioCtx.state==='suspended')audioCtx.resume();
  if(musicOsc)return;
  musicGain=audioCtx.createGain();
  musicGain.gain.value=0.04;
  musicGain.connect(audioCtx.destination);
  musicOsc=audioCtx.createOscillator();
  musicOsc.type='triangle';
  musicOsc.frequency.value=110;
  musicOsc.connect(musicGain);
  musicOsc.start();
  setInterval(()=>{
    if(!musicOsc)return;
    const notes=[110,146,164,196,220];
    musicOsc.frequency.setValueAtTime(notes[Math.floor(Math.random()*notes.length)],audioCtx.currentTime);
  },800);
}

const ghost=new THREE.Group();
ghost.visible=false;
const gBody=new THREE.Mesh(new THREE.CapsuleGeometry(0.3,0.8,4,8),
  new THREE.MeshStandardMaterial({color:0x00ffaa,transparent:true,opacity:0.35,emissive:0x00ff88,emissiveIntensity:0.4}));
gBody.position.y=0.9;ghost.add(gBody);scene.add(ghost);
let ghostPath=[],recording=[];

const coins=[];
function addCoin(x,y,z){
  const m=new THREE.Mesh(new THREE.TorusGeometry(0.4,0.1,8,12),
    new THREE.MeshStandardMaterial({color:0xffdd00,emissive:0xffaa00,emissiveIntensity:0.6}));
  m.position.set(x,y+1.6,z);m.rotation.x=Math.PI/2;scene.add(m);
  coins.push({mesh:m,got:false});
}

const pieces=[];
const movers=[];
function addBox(x,y,z,w,h,d,color,emissive){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({color,emissive:emissive||0x000000,emissiveIntensity:emissive?0.3:0,roughness:0.7,metalness:0.15}));
  m.position.set(x,y+h/2,z);
  m.castShadow=true;m.receiveShadow=true;
  m.userData={min:new THREE.Vector3(x-w/2,y,z-d/2),max:new THREE.Vector3(x+w/2,y+h,z+d/2),baseY:y};
  scene.add(m);pieces.push(m);return m;
}
function addRoof(x,y,z,w,d,color){
  addBox(x,y,z,w,1.2,d,color||0x2a2a3a);
  addBox(x,y+1.2,z-d/2+0.15,w,0.5,0.3,0x3a3a4a);
  addBox(x,y+1.2,z+d/2-0.15,w,0.5,0.3,0x3a3a4a);
  if(Math.random()>0.45)addBox(x+(Math.random()-0.5)*w*0.4,y+1.2,z+(Math.random()-0.5)*d*0.3,1.1,0.65,1.1,0x555566);
}
function clearLevel(){
  for(const m of pieces)scene.remove(m);
  pieces.length=0;
  movers.length=0;
  for(const c of coins)scene.remove(c.mesh);
  coins.length=0;
}
function buildLevel(lvl){
  clearLevel();
  p.level=lvl;
  addRoof(0,2,0,10,12,0x2a2a3e);
  if(lvl===1){
    for(let i=0;i<14;i++){
      const z=14+i*9;
      const x=(i%5-2)*4.2;
      const y=2+Math.sin(i*0.5)*1.6;
      addRoof(x,y,z,6.5,5,i%2?0x2a3344:0x332a44);
      if(i%3===0)addCoin(x,y+1.2,z);
    }
    for(let i=0;i<3;i++){
      const z=150+i*12;
      const elev=addBox(0,3,z,4.5,0.4,3.5,0x00aacc,0x00ffff);
      movers.push({mesh:elev,base:3,amp:1.8,speed:0.7+i*0.1,phase:i});
    }
    addRoof(0,4,200,8,6,0x00ff66);
  }else if(lvl===2){
    for(let i=0;i<16;i++){
      const z=12+i*8.5;
      const x=(i%4-1.5)*5.5;
      const y=2.5+Math.sin(i*0.7)*2.4;
      addRoof(x,y,z,5.5,4.5,i%2?0x3a2a44:0x2a3a44);
      if(i%2===0)addCoin(x,y+1.2,z);
    }
    for(let i=0;i<4;i++){
      const z=155+i*11;
      addBox(-5.2,0,z,1.2,10,7,0x223355,0x112244);
      addBox(5.2,0,z,1.2,10,7,0x223355,0x112244);
    }
    for(let i=0;i<3;i++){
      const z=160+i*10;
      const elev=addBox((i%2?2:-2),4,z,3.5,0.35,3,0xff3366,0xff0044);
      movers.push({mesh:elev,base:4,amp:2.5,speed:1+i*0.2,phase:i*1.5});
    }
    addRoof(0,5,210,7,5,0x00ff66);
  }else{
    for(let i=0;i<18;i++){
      const z=10+i*8;
      const x=(i%6-2.5)*4.8;
      const y=3+Math.sin(i*0.85)*3;
      addRoof(x,y,z,5,4,i%3?0x2a3344:0x442a33);
      if(i%2===1)addCoin(x,y+1.2,z);
    }
    for(let i=0;i<5;i++){
      const z=160+i*9;
      const elev=addBox(0,5,z,3.5,0.3,2.8,0x00ffaa,0x00ff88);
      movers.push({mesh:elev,base:5,amp:3,speed:1.2+i*0.15,phase:i});
    }
    for(let i=0;i<3;i++){
      const z=170+i*12;
      addBox(-6,0,z,1.4,12,6,0x112233,0x004488);
      addBox(6,0,z,1.4,12,6,0x112233,0x004488);
    }
    addRoof(0,6,220,8,6,0x00ff66);
  }
  for(let i=0;i<10;i++){
    const z=i*22-15;
    const side=i%2?-1:1;
    const h=10+Math.random()*14;
    addBox(side*18,0,z,5,h,6,0x1a1a2a,Math.random()>0.5?0x004488:0x440066);
  }
}
const p={pos:new THREE.Vector3(0,4,0),vel:new THREE.Vector3(),onGround:false,wallRun:0,coyote:0,jumpBuf:0,speed:0,time:0,running:false,finished:false,grappling:false,grappleCd:0,level:1};
buildLevel(1);

const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')p.jumpBuf=0.16;if(e.code==='KeyE')doGrapple();});
addEventListener('keyup',e=>keys[e.code]=false);

const joy=document.getElementById('joy'),knob=document.getElementById('knob');
let joyActive=false,joyX=0,joyY=0;
function joyPos(e){
  const r=joy.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=(e.clientX||e.touches[0].clientX)-cx;
  let dy=(e.clientY||e.touches[0].clientY)-cy;
  const max=48;const len=Math.hypot(dx,dy);
  if(len>max){dx=dx/len*max;dy=dy/len*max;}
  knob.style.left=(34+dx)+'px';knob.style.top=(34+dy)+'px';
  joyX=-dx/max;joyY=-dy/max;
}
joy.addEventListener('pointerdown',e=>{joyActive=true;joy.setPointerCapture(e.pointerId);joyPos(e);});
joy.addEventListener('pointermove',e=>{if(joyActive)joyPos(e);});
function joyEnd(){joyActive=false;joyX=0;joyY=0;knob.style.left='34px';knob.style.top='34px';}
joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);
document.getElementById('jumpBtn').addEventListener('pointerdown',e=>{e.preventDefault();p.jumpBuf=0.2;});
document.getElementById('grappleBtn').addEventListener('pointerdown',e=>{e.preventDefault();doGrapple();});

function doGrapple(){
  if(!p.running||p.grappling||p.grappleCd>0)return;
  p.grappling=true;
  p.grappleCd=2.5;
  p.vel.y=Math.max(p.vel.y,12);
  p.vel.z+=8;
  flash('GRAPPLE');playGrapple();
  setTimeout(()=>p.grappling=false,420);
}

function collide(){
  p.onGround=false;
  const px=p.pos.x,py=p.pos.y,pz=p.pos.z,r=0.32,h=1.75;
  for(const m of pieces){
    const b=m.userData;if(!b)continue;
    const min=b.min,max=b.max;
    if(px+r>min.x&&px-r<max.x&&pz+r>min.z&&pz-r<max.z&&py+h>min.y&&py<max.y+0.15){
      if(p.vel.y<=0&&py>max.y-0.55&&py<max.y+0.4){
        p.pos.y=max.y;p.vel.y=0;p.onGround=true;p.wallRun=0;
      }
    }
  }
  p.wallRun=0;
  if(!p.onGround){
    for(const m of pieces){
      const b=m.userData;if(!b)continue;
      const min=b.min,max=b.max;
      if(max.y-min.y<4)continue;
      const closeL=Math.abs(px-min.x)-r<0.32&&pz>min.z-0.6&&pz<max.z+0.6&&py>min.y&&py<max.y;
      const closeR=Math.abs(px-max.x)-r<0.32&&pz>min.z-0.6&&pz<max.z+0.6&&py>min.y&&py<max.y;
      if(closeL&&(keys['KeyA']||keys['ArrowLeft']||joyX<-0.3))p.wallRun=-1;
      if(closeR&&(keys['KeyD']||keys['ArrowRight']||joyX>0.3))p.wallRun=1;
    }
  }
}

function update(dt){
  if(!p.running||p.finished)return;
  p.time+=dt;
  if(p.grappleCd>0)p.grappleCd-=dt;
  document.getElementById('time').textContent=p.time.toFixed(1)+'s';
  document.getElementById('coins').textContent=state.coins+' coins'+(p.grappleCd>0?' | HOOK '+p.grappleCd.toFixed(1):'');

  for(const mv of movers){
    const y=mv.base+Math.sin(p.time*mv.speed+mv.phase)*mv.amp;
    mv.mesh.position.y=y+0.2;
    const b=mv.mesh.userData;
    const h=b.max.y-b.min.y;
    b.min.y=y;b.max.y=y+h;
  }

  if(state.night){
    rain.visible=true;
    const pos=rain.geometry.attributes.position.array;
    for(let i=0;i<rainCount;i++){
      pos[i*3+1]-=dt*18;
      if(pos[i*3+1]<0)pos[i*3+1]=28;
    }
    rain.geometry.attributes.position.needsUpdate=true;
  }else rain.visible=false;

  const left=keys['KeyA']||keys['ArrowLeft']||joyX<-0.2;
  const right=keys['KeyD']||keys['ArrowRight']||joyX>0.2;
  const up=keys['KeyW']||keys['ArrowUp']||joyY>0.2;
  const down=keys['KeyS']||keys['ArrowDown']||joyY<-0.2;
  const slide=keys['ShiftLeft']||keys['ShiftRight'];

  let wish=new THREE.Vector3();
  if(up)wish.z+=1;if(down)wish.z-=1;if(left)wish.x+=1;if(right)wish.x-=1;
  if(wish.lengthSq()>0)wish.normalize();

  const baseSpd=state.shoes?20:16;
  const accel=p.onGround?50:20;
  const maxSpd=p.onGround?(slide?baseSpd+6:baseSpd):baseSpd+4;
  p.vel.x=THREE.MathUtils.lerp(p.vel.x,wish.x*maxSpd,accel*dt*0.16);
  p.vel.z=THREE.MathUtils.lerp(p.vel.z,wish.z*maxSpd,accel*dt*0.16);

  if(p.wallRun!==0){
    p.vel.y=Math.max(p.vel.y,-1.4);
    p.vel.z=Math.max(p.vel.z,15);
    if(p.jumpBuf>0){p.vel.y=10.5;p.vel.x=p.wallRun*-9.5;p.wallRun=0;p.jumpBuf=0;flash('WALL JUMP');playWall();}
  }

  if(!p.onGround)p.vel.y-=24*dt;else p.vel.y=Math.max(0,p.vel.y);
  if(p.onGround)p.coyote=0.13;else p.coyote-=dt;
  if(p.jumpBuf>0)p.jumpBuf-=dt;
  if(p.jumpBuf>0&&(p.onGround||p.coyote>0)){p.vel.y=10.2;p.onGround=false;p.jumpBuf=0;playJump();}

  p.pos.addScaledVector(p.vel,dt);
  collide();

  for(const c of coins){
    if(c.got)continue;
    if(p.pos.distanceTo(c.mesh.position)<1.3){
      c.got=true;c.mesh.visible=false;state.coins+=5;save();flash('+5');playCoin();
    }
    c.mesh.rotation.z+=dt*3;
  }

  if(p.pos.y<-14){p.pos.set(0,5,0);p.vel.set(0,0,0);flash('LAVA RESET');}

  if(state.mode==='ghost'&&p.running){
    recording.push({t:p.time,x:p.pos.x,y:p.pos.y,z:p.pos.z});
  }
  if(state.mode==='ghost'&&ghostPath.length){
    ghost.visible=true;
    let best=ghostPath[0];
    for(const g of ghostPath){if(g.t<=p.time)best=g;else break;}
    ghost.position.set(best.x,best.y,best.z);
  }else ghost.visible=false;

  const finishZ=p.level===1?195:p.level===2?205:215;
  if(p.pos.z>finishZ&&!p.finished){
    p.finished=true;p.running=false;
    if(state.mode==='ghost'&&recording.length){
      const prev=ghostPath.length?ghostPath[ghostPath.length-1].t:9999;
      if(p.time<prev){ghostPath=recording.slice();localStorage.setItem(SAVE+'_ghost',JSON.stringify(ghostPath));flash('NEW GHOST!');}
    }
    playFinish();document.getElementById('msg').textContent='FINISH  '+p.time.toFixed(2)+'s';
    document.getElementById('msg').classList.add('show');
    setTimeout(()=>document.getElementById('overlay').style.display='flex',1400);
    document.querySelector('#overlay h1').textContent='RUN COMPLETE';
    document.querySelector('#overlay p').textContent='Time: '+p.time.toFixed(2)+'s';
  }

  p.speed=Math.hypot(p.vel.x,p.vel.z);
  document.getElementById('spd').textContent=Math.round(p.speed*3.6)+' km/h';

  player.position.copy(p.pos);player.position.y+=0.05;
  const lean=THREE.MathUtils.clamp(-p.vel.x*0.05,-0.45,0.45);
  player.rotation.z=THREE.MathUtils.lerp(player.rotation.z,lean,8*dt);
  player.rotation.x=THREE.MathUtils.lerp(player.rotation.x,p.vel.z*0.012,6*dt);

  const camTarget=p.pos.clone().add(new THREE.Vector3(0,3.8,-8));
  camera.position.lerp(camTarget,1-Math.pow(0.04,dt));
  camera.lookAt(p.pos.x,p.pos.y+1.4,p.pos.z+5);
}

function flash(t){
  const m=document.getElementById('msg');
  m.textContent=t;m.classList.add('show');
  setTimeout(()=>m.classList.remove('show'),600);
}

function startRun(mode){
  startMusic();
  state.mode=mode;save();
  buildLevel(p.level||1);
  document.getElementById('overlay').style.display='none';
  p.pos.set(0,5,0);p.vel.set(0,0,0);p.time=0;p.running=true;p.finished=false;
  recording=[];
  if(mode==='ghost'){
    try{const g=JSON.parse(localStorage.getItem(SAVE+'_ghost'));if(g)ghostPath=g;}catch(e){}
  }
  document.getElementById('msg').classList.remove('show');
  applySky();
}
document.getElementById('lvl1').onclick=()=>{p.level=1;flash('LEVEL 1');};
document.getElementById('lvl2').onclick=()=>{p.level=2;flash('LEVEL 2');};
document.getElementById('lvl3').onclick=()=>{p.level=3;flash('LEVEL 3');};
document.getElementById('startNormal').onclick=()=>startRun('normal');
document.getElementById('startGhost').onclick=()=>startRun('ghost');
document.getElementById('openShop').onclick=()=>{
  document.getElementById('overlay').style.display='none';
  document.getElementById('shop').style.display='flex';
  renderShop();
};
document.getElementById('closeShop').onclick=()=>{
  document.getElementById('shop').style.display='none';
  document.getElementById('overlay').style.display='flex';
};

function applySky(){
  if(state.night){
    scene.background=new THREE.Color(0x0a0a22);
    scene.fog=new THREE.FogExp2(0x0a0a22,0.006);
  }else{
    scene.background=new THREE.Color(0x4a9fe0);
    scene.fog=new THREE.FogExp2(0x6eb6e8,0.004);
  }
}
applySky();

function renderShop(){
  document.getElementById('coinText').textContent='Coins: '+state.coins;
  const c=document.getElementById('colors');c.innerHTML='';
  COLORS.forEach(col=>{
    const s=document.createElement('span');
    s.className='swatch'+(col===state.color?' sel':'');
    s.style.background='#'+col.toString(16).padStart(6,'0');
    s.onclick=()=>{state.color=col;save();rebuildPlayer();renderShop();};
    c.appendChild(s);
  });
  document.querySelectorAll('[data-outfit]').forEach(b=>{
    b.style.outline=b.dataset.outfit===state.outfit?'3px solid #fff':'none';
    b.onclick=()=>{state.outfit=b.dataset.outfit;save();rebuildPlayer();renderShop();};
  });
}
document.getElementById('buyTrail').onclick=()=>{
  if(state.trail){flash('OWNED');return;}
  if(state.coins>=50){state.coins-=50;state.trail=true;save();flash('TRAIL UNLOCKED');renderShop();}
  else flash('NEED 50');
};
document.getElementById('buyShoes').onclick=()=>{
  if(state.shoes){flash('OWNED');return;}
  if(state.coins>=80){state.coins-=80;state.shoes=true;save();rebuildPlayer();flash('SPEED SHOES');renderShop();}
  else flash('NEED 80');
};
document.getElementById('toggleNight').onclick=()=>{
  state.night=!state.night;save();applySky();flash(state.night?'NIGHT + RAIN':'DAY');
};
renderShop();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
});

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  update(dt);renderer.render(scene,camera);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
