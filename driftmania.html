<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DriftMania — AJ GameTime</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a12; overflow: hidden; font-family: 'Rajdhani', sans-serif;
    color: #e0e0ff; user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #gameCanvas { display: block; width: 100vw; height: 100vh; }
  #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
  #hud { display: none; position: absolute; inset: 0; pointer-events: none; }
  #speedo { position: absolute; bottom: 28px; right: 36px; text-align: right; }
  #speedValue {
    font-family: 'Orbitron', sans-serif; font-size: 52px; font-weight: 900;
    color: #00f0ff; text-shadow: 0 0 20px rgba(0,240,255,0.6); line-height: 1;
  }
  #speedUnit { font-size: 14px; color: #88aaff; letter-spacing: 2px; }
  #driftMeter { position: absolute; bottom: 28px; left: 36px; width: 200px; }
  #driftBar { height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; margin-top: 6px; }
  #driftFill {
    height: 100%; width: 0%; background: linear-gradient(90deg, #ff00aa, #ff6600);
    border-radius: 4px; box-shadow: 0 0 12px #ff00aa;
  }
  #lapInfo { position: absolute; top: 20px; left: 28px; font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 700; }
  #timer { position: absolute; top: 20px; right: 28px; font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 700; }
  #positionInfo { position: absolute; top: 52px; left: 28px; font-family: 'Orbitron', sans-serif; font-size: 18px; color: #ffd700; }
  #nitroBar {
    position: absolute; bottom: 100px; right: 36px; width: 12px; height: 110px;
    background: rgba(0,0,0,0.4); border-radius: 6px; border: 1px solid rgba(0,255,180,0.3);
  }
  #nitroFill {
    position: absolute; bottom: 0; width: 100%; height: 100%;
    background: linear-gradient(to top, #00ffaa, #00ccff); border-radius: 5px;
    box-shadow: 0 0 15px #00ffaa; transition: height 0.1s;
  }
  #driftCombo {
    position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
    font-family: 'Orbitron', sans-serif; font-size: 28px; font-weight: 900;
    color: #ff00aa; text-shadow: 0 0 30px #ff00aa; opacity: 0; pointer-events: none;
  }
  #mainMenu, #garage, #trackSelect, #results {
    display: none; position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, #1a1535 0%, #0a0a15 70%);
    z-index: 20; pointer-events: auto;
    flex-direction: column; align-items: center; justify-content: center;
  }
  #mainMenu { display: flex; }
  .logo {
    font-family: 'Orbitron', sans-serif; font-size: 64px; font-weight: 900;
    background: linear-gradient(135deg, #00f0ff, #ff00aa, #ff6600);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 6px; letter-spacing: 3px;
  }
  .tagline { font-size: 16px; color: #8899cc; margin-bottom: 36px; letter-spacing: 2px; text-align: center; padding: 0 16px; }
  .btn {
    font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 700;
    padding: 14px 40px; margin: 8px; border: none; border-radius: 8px;
    cursor: pointer; transition: all 0.2s; letter-spacing: 2px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #00c8ff, #0066ff); color: white;
    box-shadow: 0 4px 20px rgba(0,150,255,0.4);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,150,255,0.55); }
  .btn-secondary {
    background: rgba(255,255,255,0.08); color: #ccd; border: 1px solid rgba(255,255,255,0.15);
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.15); color: white; }
  .currency {
    position: absolute; top: 24px; right: 32px;
    font-family: 'Orbitron', sans-serif; font-size: 22px; color: #ffd700;
    text-shadow: 0 0 12px rgba(255,215,0,0.5);
  }
  .garage-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;
    max-width: 640px; margin: 16px 0 24px;
  }
  .upgrade-card {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(100,120,255,0.25);
    border-radius: 10px; padding: 16px; text-align: center;
  }
  .upgrade-card:hover { border-color: #00f0ff; background: rgba(0,240,255,0.08); }
  .upgrade-card h3 { font-family: 'Orbitron', sans-serif; font-size: 16px; margin-bottom: 6px; color: #00f0ff; }
  .upgrade-card .level { font-size: 13px; color: #8899cc; margin-bottom: 8px; }
  .upgrade-card .price { color: #ffd700; font-weight: 700; margin-bottom: 10px; }
  .track-list {
    display: flex; gap: 16px; margin: 20px 0; flex-wrap: wrap; justify-content: center;
    max-width: 980px; max-height: 55vh; overflow-y: auto; padding: 8px;
  }
  .track-card {
    width: 200px; background: rgba(255,255,255,0.05);
    border: 2px solid rgba(100,120,255,0.3); border-radius: 12px;
    padding: 16px; text-align: center; cursor: pointer; transition: all 0.2s;
  }
  .track-card:hover, .track-card.selected {
    border-color: #00f0ff; background: rgba(0,240,255,0.1);
    transform: translateY(-4px); box-shadow: 0 10px 24px rgba(0,240,255,0.2);
  }
  .track-card h3 { font-family: 'Orbitron', sans-serif; font-size: 15px; margin-bottom: 6px; }
  .track-card p { font-size: 12px; color: #8899cc; }
  #resultsContent { text-align: center; margin-bottom: 24px; }
  #resultsContent h2 { font-family: 'Orbitron', sans-serif; font-size: 36px; margin-bottom: 12px; }
  .stat-row { font-size: 18px; margin: 6px 0; color: #aaccff; }
  #controlsHint {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: #667; letter-spacing: 1px; text-align: center;
  }
  #touchControls { display: none; position: absolute; inset: 0; pointer-events: none; z-index: 15; }
  #touchControls.active { display: block; }
  .touch-btn {
    position: absolute; pointer-events: auto; border: 2px solid rgba(255,255,255,0.25);
    border-radius: 50%; background: rgba(20,20,40,0.55); backdrop-filter: blur(8px);
    color: white; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; touch-action: none;
    transition: background 0.1s, transform 0.1s, border-color 0.1s;
  }
  .touch-btn:active, .touch-btn.pressed {
    background: rgba(0,200,255,0.45); border-color: #00f0ff; transform: scale(0.94);
  }
  #btnLeft { left: 20px; bottom: 100px; width: 68px; height: 68px; font-size: 26px; }
  #btnRight { left: 100px; bottom: 100px; width: 68px; height: 68px; font-size: 26px; }
  #btnAccel {
    right: 20px; bottom: 100px; width: 74px; height: 74px; font-size: 12px;
    background: rgba(0,180,100,0.35); border-color: rgba(0,255,150,0.4);
  }
  #btnAccel.pressed { background: rgba(0,255,150,0.55); border-color: #00ff99; }
  #btnBrake {
    right: 104px; bottom: 100px; width: 64px; height: 64px; font-size: 11px;
    background: rgba(180,40,40,0.35); border-color: rgba(255,80,80,0.4);
  }
  #btnBrake.pressed { background: rgba(255,60,60,0.5); border-color: #ff4444; }
  #btnDrift {
    right: 20px; bottom: 186px; width: 66px; height: 66px; font-size: 11px;
    background: rgba(200,0,120,0.35); border-color: rgba(255,0,180,0.45);
  }
  #btnDrift.pressed { background: rgba(255,0,180,0.5); border-color: #ff00aa; }
  #btnNitro {
    right: 104px; bottom: 186px; width: 64px; height: 64px; font-size: 10px;
    background: rgba(0,150,220,0.35); border-color: rgba(0,220,255,0.45);
  }
  #btnNitro.pressed { background: rgba(0,220,255,0.5); border-color: #00f0ff; }
  #btnReset { left: 20px; bottom: 186px; width: 52px; height: 52px; font-size: 10px; opacity: 0.75; }
  @media (max-width: 700px) {
    #speedValue { font-size: 34px; }
    #speedo { bottom: 18px; right: 14px; }
    #driftMeter { bottom: 18px; left: 14px; width: 130px; }
    #nitroBar { bottom: 70px; right: 14px; height: 80px; }
    #lapInfo { top: 12px; left: 14px; font-size: 15px; }
    #timer { top: 12px; right: 14px; font-size: 16px; }
    #positionInfo { top: 36px; left: 14px; font-size: 14px; }
    .logo { font-size: 38px; }
    .btn { padding: 12px 28px; font-size: 14px; }
    .track-card { width: 160px; padding: 12px; }
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui">
  <div id="mainMenu">
    <div class="logo">DRIFTMANIA</div>
    <div class="tagline">TRACKMANIA-STYLE · BOTS · RAMPS · TUNNELS · 6 MAPS</div>
    <button class="btn btn-primary" onclick="showTrackSelect()">RACE</button>
    <button class="btn btn-secondary" onclick="showGarage()">GARAGE</button>
    <a href="new-games.html" class="btn btn-secondary" style="text-decoration:none;display:inline-block;">← NEW GAMES</a>
    <div id="controlsHint">Keyboard: WASD + Space (Drift) + Shift (Nitro)<br>Touch: On-screen buttons appear when racing</div>
  </div>
  <div id="garage">
    <div class="currency" id="garageMoney">💰 0</div>
    <h1 style="font-family:'Orbitron';font-size:32px;margin-bottom:8px;">GARAGE</h1>
    <p style="color:#8899cc;margin-bottom:8px;">Upgrade your machine</p>
    <div class="garage-grid" id="upgradeGrid"></div>
    <button class="btn btn-secondary" onclick="showMainMenu()">BACK</button>
  </div>
  <div id="trackSelect">
    <div class="currency" id="trackMoney">💰 0</div>
    <h1 style="font-family:'Orbitron';font-size:32px;margin-bottom:8px;">SELECT TRACK</h1>
    <div class="track-list" id="trackList"></div>
    <button class="btn btn-primary" onclick="startRace()" id="startBtn" disabled>START RACE</button>
    <button class="btn btn-secondary" onclick="showMainMenu()">BACK</button>
  </div>
  <div id="results">
    <div id="resultsContent"></div>
    <button class="btn btn-primary" onclick="showTrackSelect()">RACE AGAIN</button>
    <button class="btn btn-secondary" onclick="showGarage()">GARAGE</button>
    <button class="btn btn-secondary" onclick="showMainMenu()">MENU</button>
  </div>
  <div id="hud">
    <div id="lapInfo">LAP <span id="lapNum">1</span>/3</div>
    <div id="positionInfo">P<span id="posNum">1</span>/4</div>
    <div id="timer">00:00.000</div>
    <div id="speedo"><div id="speedValue">0</div><div id="speedUnit">KM/H</div></div>
    <div id="driftMeter"><div style="font-size:12px;letter-spacing:1px;color:#ff88cc;">DRIFT</div><div id="driftBar"><div id="driftFill"></div></div></div>
    <div id="nitroBar"><div id="nitroFill"></div></div>
    <div id="driftCombo">DRIFT</div>
  </div>
  <div id="touchControls">
    <div class="touch-btn" id="btnLeft">◀</div>
    <div class="touch-btn" id="btnRight">▶</div>
    <div class="touch-btn" id="btnAccel">GAS</div>
    <div class="touch-btn" id="btnBrake">BRAKE</div>
    <div class="touch-btn" id="btnDrift">DRIFT</div>
    <div class="touch-btn" id="btnNitro">NITRO</div>
    <div class="touch-btn" id="btnReset">RESET</div>
  </div>
</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module" src="driftmania.js"></script>
</body>
</html>
