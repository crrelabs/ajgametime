<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DriftMania — AJ GameTime</title>
</head><body style="margin:0;background:#0a0a12;color:#0ff;font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh">
<div id="s">Loading DriftMania…</div>
<script>
(async()=>{
  try {
    let b64 = '';
    for (let i = 0; i < 3; i++) {
      const r = await fetch('dm_p' + i + '.txt');
      if (!r.ok) throw new Error('part ' + i + ' missing');
      b64 += (await r.text()).trim();
    }
    const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const ds = new DecompressionStream('gzip');
    const stream = new Response(bin).body.pipeThrough(ds);
    const html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.getElementById('s').textContent = 'Load error: ' + e;
  }
})();
</script>
</body></html>
