<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>DriftMania — AJ GameTime</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head><body style="margin:0;background:#0a0a12;color:#0ff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh">
<div id="s">Loading DriftMania…</div>
<script>
(async () => {
  const parts = 4;
  let html = '';
  for (let i = 0; i < parts; i++) {
    const r = await fetch('driftmania-part' + i + '.txt');
    if (!r.ok) { document.getElementById('s').textContent = 'Failed loading part ' + i; return; }
    html += await r.text();
  }
  document.open();
  document.write(html);
  document.close();
})();
</script>
</body></html>
