<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Underwater Explorer — AJ GameTime</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Nunito:wght@600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0c4a6e;font-family:Nunito,sans-serif;color:#e0f2fe;touch-action:none}
#c{display:block;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none;z-index:10}
#top{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap}
.stat{background:rgba(12,74,110,.92);padding:6px 10px;border-radius:8px;font-family:Orbitron,sans-serif;font-size:.72rem;border:1px solid #22d3ee;color:#67e8f9}
#oxyBar{position:absolute;top:48px;left:12px;width:130px;height:9px;background:#1e293b;border-radius:4px;border:1px solid #22d3ee;overflow:hidden}
#oxyFill{height:100%;width:100%;background:#22c55e;transition:width .2s}
#hint{position:absolute;bottom:12px;left:12px;font-size:.62rem;color:#94a3b8;background:rgba(12,74,110,.75);padding:4px 8px;border-radius:6px}
#controls{position:absolute;bottom:18px;left:18px;display:flex;flex-direction:column;gap:6px;pointer-events:auto;z-index:25}
#moveRow{display:flex;gap:6px}
#fwdBtn,#backBtn,#leftBtn,#rightBtn,#upBtn,#downBtn{width:52px;height:52px;border-radius:10px;background:rgba(12,74,110,.92);border:2px solid #22d3ee;color:#22d3ee;font-size:1.1rem;font-weight:bold;cursor:pointer;user-select:none;font-family:Orbitron,sans-serif}
.overlay{position:absolute;inset:0;background:rgba(8,47,73,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;text-align:center;padding:16px}
.overlay h1{font-family:Orbitron,sans-serif;font-size:clamp(1.5rem,5.5vw,2.5rem);background:linear-gradient(135deg,#22d3ee,#0ea5e9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.3rem}
.overlay p{max-width:460px;margin:.3rem 0 .7rem;line-height:1.4;color:#94a3b8;font-size:.82rem}
.btn{display:inline-block;padding:11px 22px;margin:5px;font-family:Orbitron,sans-serif;font-size:.9rem;color:#fff;background:linear-gradient(135deg,#0ea5e9,#22d3ee);border:none;border-radius:10px;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" style="display:none">
  <div id="top">
    <div class="stat">SCORE <span id="score">0</span></div>
    <div class="stat">GOLD <span id="gold">0</span></div>
    <div class="stat">COMBO <span id="combo">0</span></div>
    <div class="stat">DEPTH <span id="depth">0</span></div>
  </div>
  <div id="oxyBar"><div id="oxyFill"></div></div>
  <div id="hint">WASD / Buttons move · Q/E or buttons up/down · Collect gold & tanks · Avoid sharks & jellies</div>
  <div id="controls">
    <div id="moveRow"><button id="fwdBtn">FWD</button><button id="upBtn">UP</button></div>
    <div id="moveRow"><button id="leftBtn">◀</button><button id="backBtn">BACK</button><button id="rightBtn">▶</button><button id="downBtn">DN</button></div>
  </div>
</div>
<div class="overlay" id="startScreen">
  <h1>UNDERWATER EXPLORER</h1>
  <p>Full 3D movement, better reef, music, treasure, oxygen tanks, boost pads, sharks, jellyfish, and more.</p>
  <button class="btn" id="startBtn">DIVE</button>
</div>
<div class="overlay" id="endScreen" style="display:none">
  <h1>SURFACED</h1>
  <p id="endText">Score: 0</p>
  <button class="btn" id="retryBtn">DIVE AGAIN</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0a3a5c);
scene.fog=new THREE.FogExp2(0x0a3a5c,0.018);
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,0.1,100);
const clock=new THREE.Clock();
scene.add(new THREE.AmbientLight(0x67e8f9,0.45));
const sun=new THREE.DirectionalLight(0xbae6fd,0.85);sun.position.set(15,25,8);scene.add(sun);

let audioCtx;
function ensureAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function beep(f,d,t,v){try{const c=ensureAudio();const o=c.createOscillator();const g=c.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||0.055,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d);}catch(e){}}
let musicOn=false;
function startMusic(){if(musicOn)return;musicOn=true;try{const c=ensureAudio();const g=c.createGain();g.gain.value=0.09;g.connect(c.destination);const notes=[98,123,147,165,147,123];let t=c.currentTime;function loop(){notes.forEach((f,i)=>{const o=c.createOscillator();o.type='sine';o.frequency.value=f;const gg=c.createGain();gg.gain.setValueAtTime(0.06,t+i*0.5);gg.gain.exponentialRampToValueAtTime(0.001,t+i*0.5+0.45);o.connect(gg);gg.connect(g);o.start(t+i*0.5);o.stop(t+i*0.5+0.48);const b=c.createOscillator();b.type='triangle';b.frequency.value=f/2;const bg=c.createGain();bg.gain.setValueAtTime(0.04,t+i*0.5);bg.gain.exponentialRampToValueAtTime(0.001,t+i*0.5+0.45);b.connect(bg);bg.connect(g);b.start(t+i*0.5);b.stop(t+i*0.5+0.48);});t+=notes.length*0.5;if(state.running)setTimeout(loop,notes.length*500);}loop();}catch(e){}}
const SFX={collect:()=>beep(720,0.07,'sine',0.06),hit:()=>beep(70,0.14,'sawtooth',0.08),boost:()=>beep(520,0.09,'square',0.05),tank:()=>beep(440,0.1,'sine',0.06)};

const state={running:false,score:0,gold:0,combo:0,oxy:100,sub:null,treasures:[],tanks:[],pads:[],sharks:[],jellies:[],fish:[],bubbles:[],keys:{},fwd:false,back:false,left:false,right:false,up:false,down:false};

const floor=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:0x0f4c5c,roughness:1}));
floor.rotation.x=-Math.PI/2;floor.position.y=-10;scene.add(floor);

function makeSub(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.45,2.2,12),new THREE.MeshStandardMaterial({color:0xf59e0b,metalness:0.5,roughness:0.25}));
  body.rotation.z=Math.PI/2;g.add(body);
  const dome=new THREE.Mesh(new THREE.SphereGeometry(0.38,10,8),new THREE.MeshStandardMaterial({color:0x22d3ee,transparent:true,opacity:0.55,emissive:0x22d3ee,emissiveIntensity:0.2}));
  dome.position.set(0.3,0.2,0);g.add(dome);
  const prop=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.7,0.1),new THREE.MeshStandardMaterial({color:0x475569}));
  prop.position.x=-1.2;g.add(prop);
  const light=new THREE.PointLight(0x67e8f9,0.6,8);light.position.set(0.8,0,0);g.add(light);
  g.position.set(0,0,0);scene.add(g);state.sub=g;state.sub.userData={prop};
}
function makeTreasure(x,y,z){
  const m=new THREE.Mesh(new THREE.OctahedronGeometry(0.28),new THREE.MeshStandardMaterial({color:0xfbbf24,emissive:0xfbbf24,emissiveIntensity:0.5}));
  m.position.set(x,y,z);scene.add(m);state.treasures.push(m);
}
function makeTank(x,y,z){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.18,0.5,8),new THREE.MeshStandardMaterial({color:0x22c55e,emissive:0x22c55e,emissiveIntensity:0.3}));
  m.position.set(x,y,z);scene.add(m);state.tanks.push(m);
}
function makePad(x,y,z){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.6,0.08,10),new THREE.MeshStandardMaterial({color:0x06b6d4,emissive:0x06b6d4,emissiveIntensity:0.4}));
  m.position.set(x,y,z);m.rotation.x=Math.PI/2;scene.add(m);state.pads.push(m);
}
function makeShark(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.ConeGeometry(0.4,1.8,7),new THREE.MeshStandardMaterial({color:0x475569}));
  body.rotation.z=-Math.PI/2;g.add(body);
  const fin=new THREE.Mesh(new THREE.ConeGeometry(0.18,0.45,4),new THREE.MeshStandardMaterial({color:0x334155}));
  fin.position.set(0,0.35,0);g.add(fin);
  g.position.set((Math.random()-0.5)*36,(Math.random()-0.5)*7-2,(Math.random()-0.5)*36);
  g.userData={speed:1.6+Math.random()*1.2,dir:Math.random()*Math.PI*2};
  scene.add(g);state.sharks.push(g);
}
function makeJelly(){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.35,8,6),new THREE.MeshStandardMaterial({color:0xa855f7,transparent:true,opacity:0.7,emissive:0xa855f7,emissiveIntensity:0.3}));
  m.position.set((Math.random()-0.5)*32,(Math.random()-0.5)*6-1,(Math.random()-0.5)*32);
  m.userData={speed:0.6+Math.random()*0.4,dir:Math.random()*Math.PI*2};
  scene.add(m);state.jellies.push(m);
}
function makeFish(){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.1+Math.random()*0.08,6,5),new THREE.MeshStandardMaterial({color:Math.random()>0.5?0xfbbf24:0x60a5fa}));
  m.position.set((Math.random()-0.5)*30,(Math.random()-0.5)*6-1,(Math.random()-0.5)*30);
  m.userData={speed:0.7+Math.random()*0.7,dir:Math.random()*Math.PI*2};
  scene.add(m);state.fish.push(m);
}
function makeCoral(x,z){
  const h=1+Math.random()*2.5;
  const colors=[0xf472b6,0x22c55e,0xf59e0b,0xa855f7];
  const m=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.35,h,6),new THREE.MeshStandardMaterial({color:colors[Math.floor(Math.random()*colors.length)]}));
  m.position.set(x,h/2-10,z);scene.add(m);
}
function makeBubble(){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.06,5,4),new THREE.MeshBasicMaterial({color:0xe0f2fe,transparent:true,opacity:0.5}));
  m.position.set(state.sub.position.x+(Math.random()-0.5)*0.4,state.sub.position.y-0.3,state.sub.position.z);
  m.userData={life:1.2,vy:1.5+Math.random()};
  scene.add(m);state.bubbles.push(m);
}

function buildWorld(){
  makeSub();
  for(let i=0;i<22;i++)makeTreasure((Math.random()-0.5)*32,(Math.random()-0.5)*6-2,(Math.random()-0.5)*32);
  for(let i=0;i<6;i++)makeTank((Math.random()-0.5)*30,(Math.random()-0.5)*5-1,(Math.random()-0.5)*30);
  for(let i=0;i<5;i++)makePad((Math.random()-0.5)*28,(Math.random()-0.5)*4-2,(Math.random()-0.5)*28);
  for(let i=0;i<5;i++)makeShark();
  for(let i=0;i<4;i++)makeJelly();
  for(let i=0;i<16;i++)makeFish();
  for(let i=0;i<35;i++)makeCoral((Math.random()-0.5)*40,(Math.random()-0.5)*40);
}
function clearWorld(){
  if(state.sub)scene.remove(state.sub);
  [...state.treasures,...state.tanks,...state.pads,...state.sharks,...state.jellies,...state.fish,...state.bubbles].forEach(o=>scene.remove(o));
  state.treasures=[];state.tanks=[];state.pads=[];state.sharks=[];state.jellies=[];state.fish=[];state.bubbles=[];state.sub=null;
}
function updateHUD(){
  document.getElementById('score').textContent=state.score;
  document.getElementById('gold').textContent=state.gold;
  document.getElementById('combo').textContent=state.combo;
  document.getElementById('depth').textContent=Math.round(-state.sub.position.y*2);
  document.getElementById('oxyFill').style.width=Math.max(0,state.oxy)+'%';
  document.getElementById('oxyFill').style.background=state.oxy>50?'#22c55e':state.oxy>25?'#fbbf24':'#ef4444';
}
function startGame(){
  ensureAudio();startMusic();
  clearWorld();
  state.running=true;state.score=0;state.gold=0;state.combo=0;state.oxy=100;
  buildWorld();updateHUD();
  document.getElementById('startScreen').style.display='none';
  document.getElementById('endScreen').style.display='none';
  document.getElementById('hud').style.display='block';
}
function endGame(){
  state.running=false;
  document.getElementById('endText').textContent='Score: '+state.score+' · Gold: '+state.gold+' · Best combo: '+state.combo;
  document.getElementById('endScreen').style.display='flex';
  document.getElementById('hud').style.display='none';
}

document.getElementById('startBtn').onclick=startGame;
document.getElementById('retryBtn').onclick=()=>{document.getElementById('endScreen').style.display='none';startGame();};

function bindHold(btn,setter){
  ['pointerdown','touchstart'].forEach(e=>btn.addEventListener(e,ev=>{ev.preventDefault();setter(true);},{passive:false}));
  ['pointerup','pointerleave','pointercancel','touchend','touchcancel'].forEach(e=>btn.addEventListener(e,()=>setter(false)));
}
bindHold(document.getElementById('fwdBtn'),v=>state.fwd=v);
bindHold(document.getElementById('backBtn'),v=>state.back=v);
bindHold(document.getElementById('leftBtn'),v=>state.left=v);
bindHold(document.getElementById('rightBtn'),v=>state.right=v);
bindHold(document.getElementById('upBtn'),v=>state.up=v);
bindHold(document.getElementById('downBtn'),v=>state.down=v);

addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='w')state.fwd=true;
  if(k==='s')state.back=true;
  if(k==='a'||k==='arrowleft')state.left=true;
  if(k==='d'||k==='arrowright')state.right=true;
  if(k==='q'||k==='arrowup')state.up=true;
  if(k==='e'||k==='arrowdown')state.down=true;
});
addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  if(k==='w')state.fwd=false;
  if(k==='s')state.back=false;
  if(k==='a'||k==='arrowleft')state.left=false;
  if(k==='d'||k==='arrowright')state.right=false;
  if(k==='q'||k==='arrowup')state.up=false;
  if(k==='e'||k==='arrowdown')state.down=false;
});

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.04);
  if(!state.running||!state.sub){renderer.render(scene,camera);return;}

  const sub=state.sub;
  let fx=0,fy=0,fz=0;
  if(state.fwd)fz-=1;
  if(state.back)fz+=1;
  if(state.left)fx-=1;
  if(state.right)fx+=1;
  if(state.up)fy+=1;
  if(state.down)fy-=1;

  const speed=4.2;
  sub.position.x=Math.max(-28,Math.min(28,sub.position.x+fx*speed*dt));
  sub.position.z=Math.max(-28,Math.min(28,sub.position.z+fz*speed*dt));
  sub.position.y=Math.max(-7,Math.min(3,sub.position.y+fy*2.6*dt));
  if(fx||fz)sub.rotation.y=Math.atan2(fx,fz);
  sub.userData.prop.rotation.x+=dt*14;
  if(Math.random()<0.3)makeBubble();

  state.oxy-=dt*1.6;
  if(state.oxy<=0){endGame();return;}

  for(let i=state.treasures.length-1;i>=0;i--){
    const t=state.treasures[i];
    t.rotation.y+=dt*2.5;
    if(sub.position.distanceTo(t.position)<0.75){
      state.gold++;state.combo++;state.score+=25+state.combo*2;state.oxy=Math.min(100,state.oxy+6);SFX.collect();
      scene.remove(t);state.treasures.splice(i,1);
      if(state.treasures.length<8)makeTreasure((Math.random()-0.5)*32,(Math.random()-0.5)*6-2,(Math.random()-0.5)*32);
    }
  }
  for(let i=state.tanks.length-1;i>=0;i--){
    const t=state.tanks[i];
    if(sub.position.distanceTo(t.position)<0.7){
      state.oxy=Math.min(100,state.oxy+25);state.score+=10;SFX.tank();
      scene.remove(t);state.tanks.splice(i,1);
      if(state.tanks.length<3)makeTank((Math.random()-0.5)*30,(Math.random()-0.5)*5-1,(Math.random()-0.5)*30);
    }
  }
  state.pads.forEach(p=>{
    if(sub.position.distanceTo(p.position)<0.8){
      sub.position.z-=4*dt;SFX.boost();
    }
  });

  state.sharks.forEach(s=>{
    s.userData.dir+=(Math.random()-0.5)*dt*1.4;
    s.position.x+=Math.cos(s.userData.dir)*s.userData.speed*dt;
    s.position.z+=Math.sin(s.userData.dir)*s.userData.speed*dt;
    s.position.x=Math.max(-30,Math.min(30,s.position.x));
    s.position.z=Math.max(-30,Math.min(30,s.position.z));
    s.lookAt(sub.position);
    if(sub.position.distanceTo(s.position)<0.95){
      state.oxy-=18;state.combo=0;state.score=Math.max(0,state.score-8);SFX.hit();
      s.position.x+=(Math.random()-0.5)*10;s.position.z+=(Math.random()-0.5)*10;
      if(state.oxy<=0){endGame();return;}
    }
  });
  state.jellies.forEach(j=>{
    j.userData.dir+=(Math.random()-0.5)*dt*1.2;
    j.position.x+=Math.cos(j.userData.dir)*j.userData.speed*dt;
    j.position.z+=Math.sin(j.userData.dir)*j.userData.speed*dt;
    j.position.y+=Math.sin(clock.elapsedTime*2+j.position.x)*dt*0.4;
    if(sub.position.distanceTo(j.position)<0.7){
      state.oxy-=12;state.combo=0;SFX.hit();
      j.position.x+=(Math.random()-0.5)*6;
      if(state.oxy<=0){endGame();return;}
    }
  });
  state.fish.forEach(f=>{
    f.userData.dir+=(Math.random()-0.5)*dt*1.8;
    f.position.x+=Math.cos(f.userData.dir)*f.userData.speed*dt;
    f.position.z+=Math.sin(f.userData.dir)*f.userData.speed*dt;
    f.position.x=Math.max(-25,Math.min(25,f.position.x));
    f.position.z=Math.max(-25,Math.min(25,f.position.z));
  });

  for(let i=state.bubbles.length-1;i>=0;i--){
    const b=state.bubbles[i];
    b.userData.life-=dt;
    b.position.y+=b.userData.vy*dt;
    b.scale.multiplyScalar(1.01);
    if(b.userData.life<=0){scene.remove(b);state.bubbles.splice(i,1);}
  }

  camera.position.lerp(new THREE.Vector3(sub.position.x,sub.position.y+4,sub.position.z+9),0.09);
  camera.lookAt(sub.position);
  updateHUD();
  renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
